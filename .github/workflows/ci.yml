name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run type checking
      run: npm run typecheck

  generated-types-drift:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify src/generated/ matches the vendored specs
      run: |
        set -e
        fail=0
        npm run generate:types -- --check || fail=1
        npm run generate:types:extract -- --check || fail=1
        if [ "$fail" -ne 0 ]; then
          echo ""
          echo "::error::The type files in src/generated/ are out of date or were hand-edited."
          echo "api-types.ts and extract-types.ts are generated from dws-api-spec.yml and"
          echo "dws-data-extraction-spec.yml respectively — they must never be edited by hand."
          echo ""
          echo "To fix: run 'npm run generate:types' and 'npm run generate:types:extract'"
          echo "locally and commit the result. If the generated output looks wrong, fix"
          echo "the vendored spec or the codegen flags in package.json — never patch the"
          echo "generated file directly. See AGENTS.md and src/generated/README.md."
          exit 1
        fi

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests with coverage
      run: npm test -- --coverage --testPathPatterns='^((?!integration).)*$'

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, generated-types-drift, unit-tests]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Verify build outputs
      run: |
        ls -la dist/
        test -f dist/index.js
        test -f dist/index.cjs
        test -f dist/index.d.ts
