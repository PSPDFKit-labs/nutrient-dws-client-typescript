name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.x'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    # Node 22 ships npm 10. Trusted publishing needs npm >= 11.5.1.
    - name: Install npm
      run: npm install -g npm@12.0.2

    - name: Install dependencies
      run: npm ci

    - name: Verify the release tag matches package.json
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        tag="${RELEASE_TAG#v}"
        pkg="$(node -p "require('./package.json').version")"
        if [ "$tag" != "$pkg" ]; then
          echo "::error::Release tag $RELEASE_TAG does not match package.json version $pkg."
          echo "Bump package.json and move the tag, or cut the release from the correct commit."
          exit 1
        fi

    - name: Verify src/generated/ matches the vendored specs
      run: |
        set -e
        npm run generate:types -- --check
        npm run generate:types:extract -- --check

    - name: Run linting
      run: npm run lint

    - name: Run type checking
      run: npm run typecheck

    # prepublishOnly runs the build and the test suite. The integration tests
    # skip themselves without NUTRIENT_API_KEY, so no key is needed here.
    - name: Publish to npm
      run: npm publish
