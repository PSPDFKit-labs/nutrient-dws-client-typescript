name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.x'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    # Pin the tool that uploads the tarball rather than taking whichever npm
    # the runner image happens to ship.
    - name: Install npm
      run: npm install -g npm@12.0.2

    - name: Install dependencies
      run: npm ci

    - name: Verify the release tag matches package.json
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        tag="${RELEASE_TAG#v}"
        pkg="$(node -p "require('./package.json').version")"
        if [ "$tag" != "$pkg" ]; then
          echo "::error::Release tag $RELEASE_TAG does not match package.json version $pkg."
          echo "Bump package.json and move the tag, or cut the release from the correct commit."
          exit 1
        fi

    - name: Verify src/generated/ matches the vendored specs
      run: |
        set -e
        npm run generate:types -- --check
        npm run generate:types:extract -- --check

    - name: Run linting
      run: npm run lint

    - name: Run type checking
      run: npm run typecheck

    - name: Build
      run: npm run build

    # npm pack does not run prepublishOnly, hence the explicit build above.
    # This is the only step that exercises the package the way a consumer gets
    # it. The exports map, the files list and the bin entries are invisible to
    # the test suite, which imports from src/.
    - name: Smoke-test the packed tarball
      run: |
        set -euo pipefail
        name="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
        tarball="$RUNNER_TEMP/$name"
        export EXPECTED="$(node -p "require('./package.json').version")"
        export BINS="$(node -p "Object.keys(require('./package.json').bin).join(' ')")"

        work="$(mktemp -d)"
        cd "$work"
        npm init -y > /dev/null
        npm install --no-audit --no-fund "$tarball"

        node -e "
          const m = require('@nutrient-sdk/dws-client-typescript');
          if (typeof m.NutrientClient !== 'function') throw new Error('CJS: NutrientClient is not exported');
          new m.NutrientClient({ apiKey: 'smoke-test-key' });
          if (m.getLibraryVersion() !== process.env.EXPECTED) throw new Error('CJS: version is ' + m.getLibraryVersion() + ', expected ' + process.env.EXPECTED);
          console.log('CJS    ok  ' + m.getLibraryVersion());
        "

        node --input-type=module -e "
          import { NutrientClient, getLibraryVersion } from '@nutrient-sdk/dws-client-typescript';
          if (typeof NutrientClient !== 'function') throw new Error('ESM: NutrientClient is not exported');
          new NutrientClient({ apiKey: 'smoke-test-key' });
          if (getLibraryVersion() !== process.env.EXPECTED) throw new Error('ESM: version is ' + getLibraryVersion() + ', expected ' + process.env.EXPECTED);
          console.log('ESM    ok  ' + getLibraryVersion());
        "

        test -f node_modules/@nutrient-sdk/dws-client-typescript/dist/index.d.ts
        echo "types  ok"

        for b in $BINS; do
          test -x "node_modules/.bin/$b" || { echo "::error::bin $b is declared in package.json but missing from the tarball"; exit 1; }
          echo "bin    ok  $b"
        done

    # prepublishOnly runs the build and the test suite. The integration tests
    # skip themselves without NUTRIENT_API_KEY, so no key is needed here.
    # access is already public via publishConfig, so --access is not repeated.
    - name: Publish to npm
      run: npm publish --provenance
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
