              type: string
              enum:
                - goToEmbedded
            relativePath:
              type: string
              description: The relative path to the embedded file.
              example: /other_document.pdf
            newWindow:
              type: boolean
              description: Whether to open the file in a new window.
            targetType:
              type: string
