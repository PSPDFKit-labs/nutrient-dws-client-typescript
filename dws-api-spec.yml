              type: array
              items:
                $ref: '#/components/schemas/AnnotationReference'
          required:
            - type
            - uri
            - flags
    ResetFormAction:
      title: ResetFormAction
      allOf:
        - $ref: '#/components/schemas/BaseAction'
        - title: ResetFormAction
          type: object
          properties:
            type:
              type: string
              enum:
                - resetForm
            flags:
              type: string
              enum:
                - includeExclude
            fields:
              type: array
              items:
                $ref: '#/components/schemas/AnnotationReference'
          required:
            - type
    NamedAction:
      title: NamedAction
      allOf:
        - $ref: '#/components/schemas/BaseAction'
        - title: NamedAction
          type: object
          properties:
            type:
              type: string
              enum:
                - named
            action:
              type: string
              enum:
                - nextPage
                - prevPage
                - firstPage
                - lastPage
                - goBack
                - goForward
                - goToPage
                - find
                - print
                - outline
                - search
                - brightness
                - zoomIn
                - zoomOut
                - saveAs
                - info
          required:
            - type
            - action
    Action:
      description: |-
        Represents a PDF action.

        There are many different action types. You can learn more about their semantics
        [here](https://www.nutrient.io/guides/ios/annotations/pdf-actions/).

        All actions have a `type` property. Depending on the type, the action object
        includes additional properties.
      example:
        type: goTo
        pageIndex: 0
      type: object
      oneOf:
        - $ref: '#/components/schemas/GoToAction'
        - $ref: '#/components/schemas/GoToRemoteAction'
        - $ref: '#/components/schemas/GoToEmbeddedAction'
        - $ref: '#/components/schemas/LaunchAction'
        - $ref: '#/components/schemas/URIAction'
        - $ref: '#/components/schemas/HideAction'
        - $ref: '#/components/schemas/JavaScriptAction'
        - $ref: '#/components/schemas/SubmitFormAction'
        - $ref: '#/components/schemas/ResetFormAction'
        - $ref: '#/components/schemas/NamedAction'
    AnnotationOpacity:
      type: number
      description: Annotation opacity. 0 is fully transparent, 1 is fully opaque.
      minimum: 0
      maximum: 1
    PdfObjectId:
      type: integer
      description: The PDF object ID of the annotation from the source PDF.
    AnnotationCustomData:
      type:
        - object
        - 'null'
      additionalProperties: true
      description: Object of arbitrary properties attached to the annotations. PSPDFKit won't modify this data when processing annotations.
      example:
        foo: bar
    BaseAnnotation:
      title: BaseAnnotation
      type: object
      properties:
        v:
          type: integer
          enum:
            - 2
          description: The specification version that the record is compliant to.
        type:
          type: string
          description: The type of the annotation.
        pageIndex:
          $ref: '#/components/schemas/PageIndex'
        bbox:
          $ref: '#/components/schemas/AnnotationBbox'
        action:
          $ref: '#/components/schemas/Action'
        opacity:
          $ref: '#/components/schemas/AnnotationOpacity'
        pdfObjectId:
          $ref: '#/components/schemas/PdfObjectId'
        id:
          type: string
          description: The unique Instant JSON identifier of the annotation.
          example: 01DNEDPQQ22W49KDXRFPG4EPEQ
        flags:
          type: array
          description: |-
            Array of annotation flags.

            | Flag | Description |
            | ---- | ----------- |
            | noPrint | Don't print. |
            | noZoom | Don't zoom with page. |
            | noRotate | Don't rotate. |
            | noView | Don't display, can be still printed. |
            | hidden | Don't display, don't print, disable any interaction with user. |
            | invisible | Ignore annotation AP stream. |
            | readOnly | Don't allow the annotation to be deleted or its properties modified. |
            | locked | Same as `readOnly` but allows changing annotation contents. |
            | lockedContents | Don't allow the contents of the annotation to be modified. |
          items:
            type: string
            enum:
              - noPrint
              - noZoom
              - noRotate
              - noView
              - hidden
              - invisible
              - readOnly
              - locked
              - toggleNoView
              - lockedContents
        createdAt:
          type: string
          description: The date of the annotation creation. ISO 8601 with full date, time, and time zone information
          format: date-time
          example: '2019-09-16T15:05:03.712909Z'
        updatedAt:
          type: string
          description: The date of the last annotation update. ISO 8601 with full date, time, and time zone information
          format: date-time
          example: '2019-09-16T15:05:03.712909Z'
        name:
          type: string
          description: The name of the annotation used to identify the annotation.
        creatorName:
          type: string
          description: The name of the creator of the annotation.
        customData:
          $ref: '#/components/schemas/AnnotationCustomData'
      required:
        - type
        - pageIndex
        - bbox
        - v
    Rect:
      type: array
      title: Rect
      description: Rectangle in a form [left, top, width, height] in PDF points (pt).
      items:
        type: number
        minItems: 4
        maxItems: 4
      example:
        - 100
        - 200
        - 300
        - 400
    AnnotationRotation:
      type: integer
      title: Rotation
      description: Counterclockwise annotation rotation in degrees.
      enum:
        - 0
        - 90
        - 180
        - 270
    AnnotationNote:
      type: string
      title: Note
      description: Text of an annotation note.
      example: This is a note.
    RedactionAnnotation:
      title: RedactionAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - title: RedactionAnnotation
          description: Redaction annotations determines the location of the area marked for redaction.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/markup/redaction
            rects:
              type: array
              description: Bounding boxes of the marked text.
              items:
                $ref: '#/components/schemas/Rect'
            outlineColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: Outline color is the border color of a redaction annotation when it hasn't yet been applied to the document
              example: '#ffffff'
            fillColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: Fill color is the background color that a redaction will have when applied to the document.
            overlayText:
              type: string
              description: The text that will be printed on top of an applied redaction annotation.
              example: CONFIDENTIAL
            repeatOverlayText:
              type: boolean
              description: Specifies whether or not the overlay text will be repeated multiple times to fill the boundaries of the redaction annotation.
            color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: Color of the overlay text (if any).
              example: '#ffffff'
            rotation:
              $ref: '#/components/schemas/AnnotationRotation'
            note:
              $ref: '#/components/schemas/AnnotationNote'
          required:
            - type
    SearchPreset:
      type: string
      description: |-
        - `credit-card-number` — matches a number with 13 to 19 digits that begins with 1—6.
        Spaces and `-` are allowed anywhere in the number.
        - `date` — matches date formats such as `mm/dd/yyyy`, `mm/dd/yy`, `dd/mm/yyyy`, and `dd/mm/yy`.
        It rejects any days greater than 31 or months greater than 12 and accepts a leading 0 in front of a single-digit day or month.
        The delimiter can be `-`, `.`, or `/`.
        - `email-address` — matches an email address. Expects the format of `*@*.*` with at least two levels of the domain name.
        - `international-phone-number` — matches international phone numbers.
        The number can have 7 to 15 digits with spaces or `-` occurring anywhere within the number, and it must have prefix of `+` or `00`.
        - `ipv4` — matches an IPv4 address with an optional mask at the end.
        - `ipv6` — matches a full and compressed IPv6 address as defined in [RFC 2373](http://www.faqs.org/rfcs/rfc2373.html).
        - `mac-address` — matches a MAC address with either `-` or `:` as a delimiter.
        - `north-american-phone-number` — matches North American-style phone numbers.
        NANPA standardization is used with international support.
        - `social-security-number` — matches a social security number.
        Expects the format of `XXX-XX-XXXX` or `XXXXXXXXX`, with X denoting digits.
        - `time` — matches time formats such as `00:00:00`, `00:00`, and `00:00 PM`. 12- and 24-hour formats are allowed.
        Seconds and AM/PM denotation are both optional.
        - `url` — matches a URL with a prefix of `http` or `https`, with an optional subdomain.
        - `us-zip-code` — matches a USA-style zip code. The format expected is `XXXXX`, `XXXXX-XXXX` or `XXXXX/XXXX`.
        - `vin` — matches US and ISO Standard 3779 Vehicle Identification Number. 
        The format expects 17 characters, with the last 5 characters being numeric. `I`, `i`, `O`, `o` ,`Q`, `q`, and `_` characters are not allowed.
      enum:
        - credit-card-number
        - date
        - email-address
        - international-phone-number
        - ipv4
        - ipv6
        - mac-address
        - north-american-phone-number
        - social-security-number
        - time
        - url
        - us-zip-code
        - vin
      example: email-address
    CreateRedactionsStrategyOptionsPreset:
      type: object
      required:
        - preset
      properties:
        preset:
          $ref: '#/components/schemas/SearchPreset'
        includeAnnotations:
          type: boolean
          default: true
          description: |-
            Determines if redaction annotations are created on top of annotations whose
            content match the provided preset.
        start:
          type: integer
          default: 0
          description: The index of the page from where you want to start the search.
        limit:
          type: integer
          default: null
          description: |-
            Starting from start, the number of pages to search. Default is to the end of
            the document.
    CreateRedactionsStrategyOptionsRegex:
      type: object
      required:
        - regex
      properties:
        regex:
          type: string
          description: Regex search term used for searching for text to redact.
          example: '@pspdfkit\\.com'
        includeAnnotations:
          type: boolean
          default: true
          description: |-
            Determines if redaction annotations are created on top of annotations whose
            content match the provided preset.
        caseSensitive:
          type: boolean
          default: true
          description: Determines if the search will be case sensitive.
        start:
          type: integer
          default: 0
          description: The index of the page from where you want to start the search.
        limit:
          type: integer
          default: null
          description: |-
            Starting from start, the number of pages to search. Default is to the end of
            the document.
    CreateRedactionsStrategyOptionsText:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Search term used for searching for text to redact.
          example: '@nutrient.io'
        includeAnnotations:
          type: boolean
          default: true
          description: |-
            Determines if redaction annotations are created on top of annotations whose
            content match the provided preset.
        caseSensitive:
          type: boolean
          default: false
          description: Determines if the search will be case sensitive.
        start:
          type: integer
          default: 0
          description: The index of the page from where you want to start the search.
        limit:
          type: integer
          default: null
          description: |-
            Starting from start, the number of pages to search. Default is to the end of
            the document.
    CreateRedactionsStrategyOptionsWordBased:
      type: object
      required:
        - word_based
      properties:
        word_based:
          type: string
          description: |-
            Search term used for word-based search to redact. Whitespace between
            characters (line breaks, tabs, Unicode space variants) is ignored when
            matching, so phrases that wrap across lines, tables, or columns can be
            matched as a single hit. Punctuation must still match exactly.
          example: Smith, John
        includeAnnotations:
          type: boolean
          default: true
          description: |-
            Determines if redaction annotations are created on top of annotations whose
            content match the provided query.
        caseSensitive:
          type: boolean
          default: false
          description: Determines if the search will be case sensitive.
        start:
          type: integer
          default: 0
          description: The index of the page from where you want to start the search.
        limit:
          type: integer
          default: null
          description: |-
            Starting from start, the number of pages to search. Default is to the end of
            the document.
    CreateRedactionsAction:
      allOf:
        - type: object
          required:
            - type
            - strategy
            - strategyOptions
          properties:
            type:
              type: string
              description: |-
                Creates redactions according to the given strategy. Once redactions are created, they need to be applied using the `applyRedactions` action.
                You can configure some visual aspects of the redaction annotation, including its background color, overlay text, and so on, by passing an optional `content` object.
              enum:
                - createRedactions
            content:
              $ref: '#/components/schemas/RedactionAnnotation'
        - oneOf:
            - type: object
              title: Preset
              required:
                - strategy
                - strategyOptions
              properties:
                strategy:
                  type: string
                  enum:
                    - preset
                strategyOptions:
                  $ref: '#/components/schemas/CreateRedactionsStrategyOptionsPreset'
            - type: object
              title: Regex
              required:
                - strategy
                - strategyOptions
              properties:
                strategy:
                  type: string
                  enum:
                    - regex
                strategyOptions:
                  $ref: '#/components/schemas/CreateRedactionsStrategyOptionsRegex'
            - type: object
              title: Text
              required:
                - strategy
                - strategyOptions
              properties:
                strategy:
                  type: string
                  enum:
                    - text
                strategyOptions:
                  $ref: '#/components/schemas/CreateRedactionsStrategyOptionsText'
            - type: object
              title: WordBased
              required:
                - strategy
                - strategyOptions
              properties:
                strategy:
                  type: string
                  enum:
                    - word_based
                strategyOptions:
                  $ref: '#/components/schemas/CreateRedactionsStrategyOptionsWordBased'
    ApplyRedactionsAction:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Applies the redactions created by an earlier `createRedactions` action.
          enum:
            - applyRedactions
    BuildAction:
      oneOf:
        - $ref: '#/components/schemas/ApplyInstantJsonAction'
        - $ref: '#/components/schemas/ApplyXfdfAction'
        - $ref: '#/components/schemas/FlattenAction'
        - $ref: '#/components/schemas/OcrAction'
        - $ref: '#/components/schemas/RotateAction'
        - $ref: '#/components/schemas/WatermarkAction'
        - $ref: '#/components/schemas/CreateRedactionsAction'
        - $ref: '#/components/schemas/ApplyRedactionsAction'
    FilePart:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/FileHandle'
        password:
          type: string
          description: The password for the input file
        pages:
          $ref: '#/components/schemas/PageRange'
        layout:
          allOf:
            - type: object
              description: Defines the layout of the generated pages. Only valid for email (e.g. EML and MSG) and spreadsheet (e.g. XLSX) inputs.
            - $ref: '#/components/schemas/PageLayout'
        content_type:
          type: string
          description: The content type of the file. Used to determine the file type when the file content type is not available and can't be inferred.
          example: application/pdf
        markup_mode:
          type: string
          default: noMarkup
          description: |-
            Controls how markup (comments, tracked changes) is preserved during DOCX document conversion.
            Only relevant for DOCX documents (.docx).
            - `noMarkup` — Render the document as if all changes were accepted.
            - `original` — Render the document as if all changes were rejected.
            - `simpleMarkup` — Render with changes accepted and comments as annotations.
            - `allMarkup` — Render with all markups visible, including redlines and comments.
          enum:
            - noMarkup
            - original
            - simpleMarkup
            - allMarkup
        email_language:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
          description: |-
            BCP 47 language tag used for email (EML and MSG) conversion.
            Controls email date/time formatting and header label translations.
            When omitted for email conversion, Document Engine uses `en-US`.
          example: de-DE
        email_timezone:
          type: string
          minLength: 1
          maxLength: 128
          description: |-
            IANA timezone name used for email (EML and MSG) conversion.
            Controls the timezone used when rendering email timestamps.
            Document Engine validates the value against the system timezone database.
            When omitted for email conversion, Document Engine uses `UTC`.
          example: Europe/Prague
        half_transparent_header_footer:
          type: boolean
          description: |-
            Renders headers and footers as half-transparent when converting Word documents to PDF.
            Only applicable to Word documents (.doc, .docx, .odt, .rtf). Default: false
          default: false
        render_only_print_area:
          type: boolean
          default: false
          description: |-
            Specifies whether to render only the print area for spreadsheet files.
            Only relevant for spreadsheet files (e.g., XLSX, XLS).
            When true, only the defined print area is rendered.
            When false, the entire spreadsheet content is rendered.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/BuildAction'
      required:
        - file
      example:
        file: pdf-file-from-multipart
    HTMLPart:
      type: object
      required:
        - html
      properties:
        html:
          $ref: '#/components/schemas/FileHandle'
        assets:
          type: array
          description: List of asset names imported in the HTML. References the name passed in the multipart request.
          items:
            type: string
        layout:
          $ref: '#/components/schemas/PageLayout'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/BuildAction'
    NewPagePart:
      type: object
      required:
        - page
      properties:
        page:
          type: string
          enum:
            - new
        pageCount:
          type: integer
          minimum: 1
          default: 1
          description: Number of pages to be added.
        layout:
          $ref: '#/components/schemas/PageLayout'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/BuildAction'
    DocumentId:
      type: string
      title: Document ID
      example: 7KPZW8XFGM4F1C92KWBK1B748M
      description: The ID of the document.
    DocumentPart:
      type: object
      description: |-
        This allows to reference a document stored on Document Engine.
        It is also possible to refer to currently scoped file by using special ID:
          ```
          {"document": {"id": "#self"}}
          ```
      properties:
        document:
          type: object
          required:
            - id
          properties:
            id:
              oneOf:
                - $ref: '#/components/schemas/DocumentId'
                - type: string
                  title: Self
                  description: Special ID that allows to refer to currently scoped document (including layer if using layers path).
                  enum:
                    - '#self'
            layer:
              type: string
              description: The name of the layer to be used.
              example: my-existing-layer
        password:
          type: string
          description: The password for the input file
        pages:
          $ref: '#/components/schemas/PageRange'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/BuildAction'
      required:
        - document
    Part:
      oneOf:
        - $ref: '#/components/schemas/FilePart'
        - $ref: '#/components/schemas/HTMLPart'
        - $ref: '#/components/schemas/NewPagePart'
        - $ref: '#/components/schemas/DocumentPart'
    Title:
      type:
        - string
        - 'null'
      description: The document title.
      example: Nutrient Document Engine API Specification
    Metadata:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/Title'
        author:
          type: string
          description: The document author.
          example: Document Author
    Label:
      type: object
      required:
        - pages
        - label
      properties:
        pages:
          type: array
          description: Array of page numbers (0-based indexing)
          items:
            type: integer
            description: A specific page number
            example:
              - 0
        label:
          type: string
          description: The label to apply to specified pages.
          example: Page I-III
    PDFUserPermission:
      type: string
      enum:
        - printing
        - modification
        - extract
        - annotations_and_forms
        - fill_forms
        - extract_accessibility
        - assemble
        - print_high_quality
    OptimizePdf:
      type: object
      properties:
        grayscaleText:
          type: boolean
          default: false
        grayscaleGraphics:
          type: boolean
          default: false
        grayscaleImages:
          type: boolean
          default: false
        grayscaleFormFields:
          type: boolean
          default: false
        grayscaleAnnotations:
          type: boolean
          default: false
        disableImages:
          type: boolean
          default: false
        mrcCompression:
          type: boolean
          default: false
        imageOptimizationQuality:
          type: integer
          default: 2
          minimum: 1
          maximum: 4
        linearize:
          type: boolean
          default: false
          description: |-
            If set to `true`, the resulting PDF file will be linearized.
            This means that the document will be optimized in a special way that allows it to be loaded faster over the network.
            You need the `Linearization` feature to be enabled in your Nutrient Document Engine license in order to use this option.
    BasePDFOutput:
      type: object
      description: Object representing PDF output.
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        user_password:
          type: string
          description: |-
            Defines the password which allows to open a file with defined
            permissions
        owner_password:
          type: string
          description: Defines the password which allows to manage the permissions for the file
        user_permissions:
          type: array
          description: Defines the permissions which are granted when a file is opened with user password
          items:
            $ref: '#/components/schemas/PDFUserPermission'
        optimize:
          $ref: '#/components/schemas/OptimizePdf'
    PDFOutput:
      allOf:
        - $ref: '#/components/schemas/BasePDFOutput'
        - type: object
          properties:
            type:
              type: string
              enum:
                - pdf
    PDFAOutput:
      allOf:
        - $ref: '#/components/schemas/BasePDFOutput'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - pdfa
            conformance:
              type: string
              enum:
                - pdfa-1a
                - pdfa-1b
                - pdfa-2a
                - pdfa-2u
                - pdfa-2b
                - pdfa-3a
                - pdfa-3u
              description: |-
                Defines the conformance level of the output file.
                The default value is `pdfa-1b`.

                These are the only supported conformance levels at this time.
            vectorization:
              type: boolean
              default: true
              description: 'When set to true, produces vector based graphic elements where applicable. For example: fonts and paths.'
            rasterization:
              type: boolean
              default: true
              description: 'When set to true, produces raster based graphic elements where applicable. For example: images.'
    PDFUAOutput:
      allOf:
        - $ref: '#/components/schemas/BasePDFOutput'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - pdfua
    ImageOutput:
      type: object
      title: ImageOutput
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - image
        format:
          type: string
          default: png
          description: The format of the rendered image.
          enum:
            - png
            - jpeg
            - jpg
            - webp
        pages:
          $ref: '#/components/schemas/PageRange'
        width:
          type: number
          description: The width of the rendered image in pixels. You must specify at least one of either width, height or dpi
        height:
          type: number
          description: The height of the rendered image in pixels. You must specify at least one of either width, height or dpi
        dpi:
          type: number
          description: The resolution of the rendered image in dots per inch. You must specify at least one of either width, height or dpi
      description: Render the document as an image.
    JSONContentOutput:
      type: object
      title: JSONContentOutput
      required:
        - type
      description: JSON with document contents. Returned for `json-content` output type.
      properties:
        type:
          type: string
          enum:
            - json-content
        plainText:
          type: boolean
          default: true
          description: When set to true, extracts document text. Text is extracted via OCR process.
        structuredText:
          type: boolean
          default: false
          description: When set to true, extracts structured document text. This includes text words, characters, lines and paragraphs.
        keyValuePairs:
          type: boolean
          default: false
          description: When set to true, extracts key-value pairs detected within the document contents. Example of detected values are phone numbers, email addresses, currencies, numbers, dates, etc.
        tables:
          type: boolean
          default: true
          description: When set to true, extracts tabular data from the document.
        language:
          oneOf:
            - $ref: '#/components/schemas/OcrLanguage'
            - type: array
              items:
                $ref: '#/components/schemas/OcrLanguage'
    OfficeOutput:
      type: object
      title: OfficeOutput
      required:
        - type
      properties:
        type:
          type: string
          description: The output office file type.
          enum:
            - docx
            - xlsx
            - pptx
    HTMLOutput:
      type: object
      title: HTMLOutput
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - html
        layout:
          type: string
          description: |-
            The layout type to use for conversion to HTML:

            * `page` layout keeps the original structure of the document, segmented by page.
            * `reflow` layout converts the document into a continuous flow of text, without page breaks.
          enum:
            - page
            - reflow
    MarkdownOutput:
      type: object
      title: MarkdownOutput
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - markdown
    BuildOutput:
      oneOf:
        - $ref: '#/components/schemas/PDFOutput'
        - $ref: '#/components/schemas/PDFAOutput'
        - $ref: '#/components/schemas/PDFUAOutput'
        - $ref: '#/components/schemas/ImageOutput'
        - $ref: '#/components/schemas/JSONContentOutput'
        - $ref: '#/components/schemas/OfficeOutput'
        - $ref: '#/components/schemas/HTMLOutput'
        - $ref: '#/components/schemas/MarkdownOutput'
    BuildInstructions:
      type: object
      properties:
        parts:
          type: array
          description: |-
            Parts of the document to be built.

            Multiple types of parts are supported:
            * `FilePart` that represents a binary input file that can be either a part name in the `multipart/form-data` request or an URL of a remote file.
            * `HTMLPart` that represents an HTML input file along with it's assets.
            * `NewPagePart` that represents a document with empty pages.
            * `DocumentPart` that represents a document (with optional layer) managed by Nutrient Document Engine. Only applicable if used in a Document Engine context.
          items:
            $ref: '#/components/schemas/Part'
        actions:
          type: array
          description: Actions to be performed on the document after it is built.
          items:
            $ref: '#/components/schemas/BuildAction'
        output:
          $ref: '#/components/schemas/BuildOutput'
      required:
        - parts
    PlainText:
      type: string
      description: Page text extracted via OCR process. This property is present only when `plainText` is set to `true`.
      example: |
        Lorem ipsum dolor sit amet, consectetuer adipiscing elit. Aenean commodo ligula eget dolor. Aenean massa.
    JsonContentsBbox:
      type: object
      description: Represents a rectangular region on the page. Both coordinates and directions are in PDF points with the origin at the top-left corner of the page.
      properties:
        left:
          type: number
          example: 0
        top:
          type: number
          example: 0
        width:
          type: number
          example: 100
        height:
          type: number
          example: 100
      required:
        - left
        - top
        - width
        - height
    Character:
      type: object
      properties:
        bbox:
          $ref: '#/components/schemas/JsonContentsBbox'
        value:
          type: string
          example: T
      required:
        - bbox
        - value
    Line:
      type: object
      properties:
        bbox:
          $ref: '#/components/schemas/JsonContentsBbox'
        firstWordIndex:
          type: integer
          description: The index of the first word of the line from the `characters`  array.
          example: 0
        isRTL:
          type: boolean
          description: Specifies if the line is written from right to left.
          example: false
        isVertical:
          type: boolean
          description: Specifies if the line is vertically oriented.
          example: false
        wordCount:
          type: integer
          description: The number of words in the line.
          example: 5
      required:
        - bbox
        - firstWordIndex
        - isRTL
        - isVertical
        - wordCount
    Paragraph:
      type: object
      properties:
        bbox:
          $ref: '#/components/schemas/JsonContentsBbox'
        firstLineIndex:
          type: integer
          description: The index of the first line of the paragraph from the `lines` array.
          example: 0
        lineCount:
          type: integer
          description: The number of lines in the paragraph.
          example: 3
      required:
        - bbox
        - firstLineIndex
        - lineCount
    Word:
      type: object
      properties:
        bbox:
          $ref: '#/components/schemas/JsonContentsBbox'
        characterCount:
          type: integer
          description: The number of characters in the word.
          example: 4
        firstCharacterIndex:
          type: integer
          description: The index of the first character of the word from the `characters` array.
          example: 0
        isFromDictionary:
          type: boolean
          description: Specifies if the word has been identified from the OCR dictionary.
          example: true
        value:
          type: string
          description: The actual word text.
          example: word
      required:
        - bbox
        - characterCount
        - firstCharacterIndex
        - isFromDictionary
        - value
    StructuredText:
      type: object
      properties:
        characters:
          type: array
          description: A list of characters detected within the page.
          items:
            $ref: '#/components/schemas/Character'
        lines:
          type: array
          description: A list of lines detected within the page.
          items:
            $ref: '#/components/schemas/Line'
        paragraphs:
          type: array
          description: A list of paragraphs detected within the page.
          items:
            $ref: '#/components/schemas/Paragraph'
        words:
          type: array
          description: A list of words detected within the page.
          items:
            $ref: '#/components/schemas/Word'
    Confidence:
      type: number
      description: Specifies the confidence score of pair, in the range [0 - 100].
      example: 95.4
    KVPKey:
      type: object
      description: The key of the detected key-value pair.
      properties:
        bbox:
          $ref: '#/components/schemas/JsonContentsBbox'
        content:
          type: string
          description: The detected key text. `#` is the value does not have a key.
          example: '#'
      required:
        - bbox
        - content
    KVPValue:
      type: object
      description: The value of the detected key-value pair.
      properties:
        bbox:
          $ref: '#/components/schemas/JsonContentsBbox'
        content:
          type: string
          description: The detected value text.
          example: €
        dataType:
          type: string
          description: 'The value type. One of the following: `Unknown`, `PhoneNumber`, `EmailAddress`, `Currency`, `Number`, `DateTime`, `String`, `PostCode`, `URL`, `Percentage`, `Symbol`, `VatIDValue`, `TimePeriod`, `IBAN`, `BIC`, `CreditCard`, `UID`, `PostalAddress`, `VIN`, `SSN`'
          example: Currency
      required:
        - bbox
        - content
        - dataType
    KeyValuePair:
      type: object
      properties:
        confidence:
          $ref: '#/components/schemas/Confidence'
        key:
          $ref: '#/components/schemas/KVPKey'
        value:
          $ref: '#/components/schemas/KVPValue'
      required:
        - confidence
        - key
        - value
    TableCell:
      type: object
      properties:
        bbox:
          $ref: '#/components/schemas/JsonContentsBbox'
        rowIndex:
          type: integer
          description: An index of a row the cell belongs to (0-based).
          example: 0
        columnIndex:
          type: integer
          description: An index of a column the cell belongs to (0-based).
          example: 0
        isHeader:
          type: boolean
          description: Specifies if the cell has been identified as a part of the table header.
          example: true
        text:
          type: string
          description: The content of the cell.
          example: Invoice number
      required:
        - bbox
        - rowIndex
        - columnIndex
        - isHeader
        - text
    TableColumn:
      type: object
      properties:
        bbox:
          $ref: '#/components/schemas/JsonContentsBbox'
      required:
        - bbox
    TableLine:
      type: object
      properties:
        bbox:
          $ref: '#/components/schemas/JsonContentsBbox'
        isVertical:
          type: boolean
          description: Specifies if the line is oriented vertically.
          example: false
        thickness:
          type: number
          description: The thickness of the line, in PDF points.
      required:
        - bbox
    TableRow:
      type: object
      properties:
        bbox:
          $ref: '#/components/schemas/JsonContentsBbox'
      required:
        - bbox
    Table:
      type: object
      properties:
        confidence:
          $ref: '#/components/schemas/Confidence'
        bbox:
          $ref: '#/components/schemas/JsonContentsBbox'
        cells:
          type: array
          description: A list of table cells.
          items:
            $ref: '#/components/schemas/TableCell'
        columns:
          type: array
          description: A list of table columns.
          items:
            $ref: '#/components/schemas/TableColumn'
        lines:
          type: array
          description: A list of physical lines in the table.
          items:
            $ref: '#/components/schemas/TableLine'
        rows:
          type: array
          description: A list of table rows.
          items:
            $ref: '#/components/schemas/TableRow'
      required:
        - bbox
        - cells
        - columns
        - confidence
        - lines
        - rows
    PageJsonContents:
      type: object
      required:
        - pageIndex
      properties:
        pageIndex:
          type: integer
          minimum: 0
          description: 0-based index of the page in the document.
          example: 0
        plainText:
          $ref: '#/components/schemas/PlainText'
        structuredText:
          $ref: '#/components/schemas/StructuredText'
        keyValuePairs:
          type: array
          description: A list of detected key-value pairs on the page.
          items:
            $ref: '#/components/schemas/KeyValuePair'
        tables:
          type: array
          description: A list of detected tables on the page.
          items:
            $ref: '#/components/schemas/Table'
    BuildResponseJsonContents:
      type: object
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PageJsonContents'
    HostedErrorResponse:
      type: object
      properties:
        details:
          type: string
          example: The request is malformed
        status:
          type: integer
          enum:
            - 400
            - 402
            - 408
            - 413
            - 422
            - 500
        requestId:
          type: string
          example: xy123zzdafaf
        failingPaths:
          type: array
          description: List of failing paths.
          items:
            type: object
            properties:
              path:
                type: string
                example: $.property[0]
              details:
                type: string
                example: Missing required property
    OfficeTemplateModel:
      type: object
      description: |-
        Full office template payload for the multipart `model` request part.
        The preferred shape is `{ "config": { ... }, "model": { ... } }`.
        The API also accepts legacy bare model objects for backward compatibility.
      properties:
        config:
          type: object
          description: Configuration for Office template processing.
          properties:
            delimiter:
              type: object
              description: |-
                Pair of delimiters that encloses a template marker. The `model` object associates a
                template marker with the corresponding substitution in the produced document.
              properties:
                start:
                  type: string
                  default: '{'
                  example: '{{'
                end:
                  type: string
                  default: '}'
                  example: '}}'
        model:
          type: object
          description: The object that contains placeholder substitutions, loops, nested objects, and image marker values.
          additionalProperties:
            oneOf:
              - title: Placeholder marker
                type: string
                description: A string substitution value.
              - title: Number marker
                type: number
                description: A numeric substitution value.
              - title: Boolean marker
                type: boolean
                description: A boolean substitution value.
              - title: Null marker
                type: 'null'
                description: A null substitution value.
              - title: Loop marker
                type: array
                description: A loop marker that expands a repeating template section.
                items:
                  type: object
                  additionalProperties: true
              - title: Nested object marker
                type: object
                description: 'A nested group of template substitutions. Objects with `_type: "image"` follow the image marker schema below.'
                additionalProperties: true
                not:
                  required:
                    - _type
                  properties:
                    _type:
                      enum:
                        - image
              - title: Image marker
                type: object
                description: |-
                  An image marker object used to substitute template image tags such as `` and ``.
                  `source: "dataUrl"` is accepted and normalized to `source: "base64"` at runtime.
                  `source: "file"` is rejected in the public API at runtime.
                required:
                  - _type
                  - source
                oneOf:
                  - title: Inline image marker
                    required:
                      - data
                    properties:
                      source:
                        enum:
                          - base64
                          - dataUrl
                  - title: Remote URL image marker
                    properties:
                      source:
                        enum:
                          - url
                    anyOf:
                      - required:
                          - url
                      - required:
                          - path
                properties:
                  _type:
                    type: string
                    enum:
                      - image
                  source:
                    type: string
                    enum:
                      - base64
                      - dataUrl
                      - url
                  data:
                    type: string
                    description: 'Base64 payload or data URL string for `source: "base64"` / `source: "dataUrl"`.'
                  url:
                    type: string
                    description: 'HTTP(S) URL used when `source: "url"`.'
                  path:
                    type: string
                    description: 'Legacy alias for `url` when `source: "url"`.'
                  format:
                    type: string
                    enum:
                      - png
                      - jpg
                      - jpeg
                      - gif
                      - bmp
                      - tif
                      - tiff
                  sizing:
                    type: string
                    enum:
                      - original
                      - fixed
                      - fit-width
                      - fit-height
                      - fit-max
                  width:
                    type: number
                  height:
                    type: number
                  borderWidth:
                    type: number
                  borderColor:
                    type: string
                  borderStyle:
                    type: string
                  link:
                    type: string
                  caption:
                    type: string
                  captionLabel:
                    type: string
                  captionPosition:
                    type: string
                  rotation:
                    type: number
                  pageNumber:
                    type: integer
                    minimum: 1
                  altText:
                    type: string
                  title:
                    type: string
                additionalProperties: true
          example:
            placeholder: replacement value
            enabled: true
            count: 3
            logo:
              _type: image
              source: base64
              data: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP8z8DwHwAF+wJ/lxS6RQAAAABJRU5ErkJggg==
              format: png
            loop-name:
              - placeholder-within-loop: replacement value
                another-placeholder-within-loop: replacement value 2
              - placeholder-within-loop: another replacement value
                another-placeholder-within-loop: another replacement value 2
    url:
      type: string
      description: Specifies the URL from a file can be downloaded
      example: https://remote-file-storage/input-file
    password:
      type: string
      description: The password for the input file
    layout:
      allOf:
        - type: object
          description: Defines the layout of the generated pages. Only valid for email (e.g. EML and MSG) and spreadsheet (e.g. XLSX) inputs.
        - $ref: '#/components/schemas/PageLayout'
    content_type:
      type: string
      description: The content type of the file. Used to determine the file type when the file content type is not available and can't be inferred.
      example: application/pdf
    markup_mode:
      type: string
      default: noMarkup
      description: |-
        Controls how markup (comments, tracked changes) is preserved during DOCX document conversion.
        Only relevant for DOCX documents (.docx).
        - `noMarkup` — Render the document as if all changes were accepted.
        - `original` — Render the document as if all changes were rejected.
        - `simpleMarkup` — Render with changes accepted and comments as annotations.
        - `allMarkup` — Render with all markups visible, including redlines and comments.
      enum:
        - noMarkup
        - original
        - simpleMarkup
        - allMarkup
    email_language:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
      description: |-
        BCP 47 language tag used for email (EML and MSG) conversion.
        Controls email date/time formatting and header label translations.
        When omitted for email conversion, Document Engine uses `en-US`.
      example: de-DE
    email_timezone:
      type: string
      minLength: 1
      maxLength: 128
      description: |-
        IANA timezone name used for email (EML and MSG) conversion.
        Controls the timezone used when rendering email timestamps.
        Document Engine validates the value against the system timezone database.
        When omitted for email conversion, Document Engine uses `UTC`.
      example: Europe/Prague
    assets:
      type: array
      description: List of asset names imported in the HTML. References the name passed in the multipart request.
      items:
        type: string
    text:
      type: string
      description: Text used for watermarking
    fontFamily:
      type: string
      description: The font to render the text. Fonts are client specific, so you should only use fonts you know are present in the browser where they should be displayed. If a font isn't found, PSPDFKit will automatically fall back to a sans-serif font.
      example: Helvetica
    fontSize:
      description: Size of the text in points.
      type: integer
      example: 10
    fontColor:
      type: string
      pattern: ^#[0-9a-fA-F]{6}$
      description: A foreground color of the text.
      example: '#ffffff'
    fontStyle:
      type: array
      description: Text style. Can be only italic, only bold, italic and bold, or none of these.
      items:
        type: string
        enum:
          - bold
          - italic
    rotation:
      type: number
      description: Rotation of the watermark in counterclockwise degrees.
      default: 0
    opacity:
      type: number
      description: Watermark opacity. 0 is fully transparent, 1 is fully opaque.
      minimum: 0
      maximum: 1
    BuiltInTemplate:
      type: string
      description: |-
        A built-in template identifier. When specified, the template's CSS and layout
        are used as the base styling. Use the `css` parameter to override specific styles
        on top of the template and `layout` to override default page layout. When omitted, `built-in:default` is used.

        **Report templates** — optimized for multi-page documents, articles, and documentation:

        | Template | Page | Description |
        |----------|------|-------------|
        | `built-in:default` | A4 | GitHub-flavored Markdown style. Arimo font, 14px body, heading underlines, light gray table headers. Used when no template is specified. |
        | `built-in:minimal` | A4, narrow margins | Clean and lightweight. Carlito 10pt, no heading borders, minimal decoration. Maximizes content area. |
        | `built-in:corporate` | US Letter, 1in margins | Professional business style. Carlito 11pt, navy headings and table headers. Suitable for formal business documents. |
        | `built-in:elegant` | A4 | Dense report style with blue accent on H5/H6 headings. Carlito 10pt body, dark table headers. Optimized for data-heavy reports. |
        | `built-in:executive` | A4, 1in margins | Premium and polished. Carlito 10pt with generous whitespace, large 32pt title. Designed for presentation-quality reports. |
        | `built-in:nordic` | A4 | Scandinavian design with serif headings (Caladea) and sans-serif body (Carlito 11pt). Blue accent on H3–H6. |
        | `built-in:nordic-report` | A4 | Dense Nordic style for data-heavy reports. Carlito 10pt, dark navy table headers, alternating row colors. |
        | `built-in:technical` | A4, tight margins | Information-dense technical documentation. Carlito 10pt with tight line-height, prominent code blocks. Maximizes content per page. |

        **Presentation templates** — larger text and more whitespace for executive briefings:

        | Template | Page | Description |
        |----------|------|-------------|
        | `built-in:elegant-presentation` | A4 | Elegant scaled up for presentations. Carlito 12pt body, 36pt title, 28pt H1. Blue accent on H5/H6. |
        | `built-in:nordic-executive` | A4 | Premium with massive 48pt title, 36pt H1 with blue border-bottom. Inverted code blocks (dark background). |
        | `built-in:nordic-presentation` | A4 | Nordic style scaled 1.3× for projection. 36pt title, 28pt H1, dark navy table headers. |
      enum:
        - built-in:default
        - built-in:minimal
        - built-in:corporate
        - built-in:elegant
        - built-in:executive
        - built-in:nordic
        - built-in:nordic-report
        - built-in:technical
        - built-in:elegant-presentation
        - built-in:nordic-executive
        - built-in:nordic-presentation
      default: built-in:default
      example: built-in:elegant
    SyntaxHighlightConfig:
      type: object
      description: Configuration for syntax highlighting of fenced code blocks.
      properties:
        theme:
          type: string
          default: onedark
          description: |-
            Color theme name. Available themes:

            **Dark:** `onedark` (default), `dracula`, `monokai`, `nord`, `github-dark`, `github-dark-dimmed`,
            `gruvbox-dark`, `catppuccin-mocha`, `base16-ocean-dark`, `ayu-dark`, `ayu-mirage`, `solarized-dark`,
            `visual-studio-dark`, `material-dark`, `night-owl`, `synthwave-84`, `coldark-dark`, `tokyonight-storm`,
            `tokyonight-night`, `kanagawa-wave`, `kanagawa-dragon`, `rose-pine`, `rose-pine-moon`, `nightfox`,
            `nordfox`, `carbonfox`, `terafox`, `duskfox`, `everforest-dark`, `oxocarbon-dark`, `tomorrow-night`,
            `zenburn`.

            **Light:** `github`, `github-light`, `inspired-github`, `catppuccin-latte`, `gruvbox-light`,
            `solarized-light`, `ayu-light`, `material-light`, `one-light`, `coldark-cold`, `tokyonight-day`,
            `kanagawa-lotus`, `rose-pine-dawn`, `dawnfox`, `dayfox`, `everforest-light`, `oxocarbon-light`,
            `emacs`, `base16-ocean-light`.
          example: onedark
    MarkdownOptions:
      type: object
      description: |-
        Options controlling Markdown parsing, rendering, and syntax highlighting. All sub-objects
        are optional — when omitted, defaults are applied. See individual sections for defaults.
      properties:
        syntax_highlight:
          oneOf:
            - $ref: '#/components/schemas/SyntaxHighlightConfig'
            - type: boolean
              enum:
                - false
              description: Set to `false` to disable syntax highlighting entirely.
          description: |-
            Syntax highlighting configuration for fenced code blocks. Set to `false` to disable
            highlighting entirely, or provide a configuration object. When omitted, highlighting
            is enabled with the `onedark` theme.
    CreateDigitalSignature:
      title: CreateDigitalSignature
      type: object
      properties:
        flatten:
          type: boolean
          description: |-
            Controls whether to flatten the document before signing it.
            This is useful when you want the document's appearance to remain stable before signing and to ensure there's no indication that the document can be edited after signing.

            Note that the resulting document's records (annotations and form fields) will be deleted.
          default: false
        formFieldName:
          type: string
          description: |-
            Name of the signature form field to sign. Use this when signing an existing signature form field.
            If a signature field with this name does not exist in the document, it will be created at the position specified with `position`.

            If a signature field with the specified name exists and `position` is also set, the request will result in an error.

            Note: Either `formFieldName` or `position` must be provided if creating a visible signature.
          example: signatureI-field
        appearance:
          description: The appearance settings for the visible signature. Omit if you want an invisible signature to be created.
          type: object
          properties:
            mode:
              type: string
              description: |-
                Specifies what will be rendered in the signature appearance: graphics, description, or both.
                Visit the [Configure Digital Signature Appearance guide](https://www.nutrient.io/guides/web/signatures/digital-signatures/signature-lifecycle/configure-digital-signature-appearance/) for a detailed description of the signature modes.
              default: signatureAndDescription
              example: signatureOnly
              enum:
                - signatureOnly
                - signatureAndDescription
                - descriptionOnly
            contentType:
              type: string
              description: |-
                The content type of the watermark image when provided in the `image` parameter of the multipart request.
                Supported types are `application/pdf`, `image/png`, and `image/jpeg`.
              example: image/png
            showWatermark:
              type: boolean
              description: |-
                Controls whether to include the watermark in the signature appearance.
                When `true` and a watermark image is provided via the `watermark` parameter, it will be included.
                When `true` and no watermark image is provided, the Nutrient logo will be used as the default watermark.
              default: true
            showSignDate:
              type: boolean
              description: |-
                Controls whether to show the signing date and time in the signature appearance.
                When `true`, the date and time will be shown in ISO 8601 format.
                Example: 2023-06-15 13:57:31
              default: true
            showDateTimezone:
              type: boolean
              description: |-
                Controls whether to include the timezone in the signing date.
                Only applies when `showSignDate` is `true`.
              default: false
        position:
          type: object
          description: Position of the visible signature form field. Omit if you want an invisible signature or if you specified the `formFieldName` option.
          required:
            - pageIndex
            - rect
          properties:
            pageIndex:
              type: integer
              minimum: 0
              description: The index of the page where the signature appearance will be rendered.
            rect:
              type: array
              description: |-
                An array of 4 numbers (points) representing the bounding box where the signature appearance will be rendered on the specified `pageIndex`.

                [left, top, width, height]

                The unit is PDF points (1 PDF point equals 1⁄72 of an inch).
                The first two numbers describe the [left,top] coordinates of the top left corner of the bounding box,
                while the second two numbers describe the width and height of the bounding box.
              minItems: 4
              maxItems: 4
              items:
                type: number
      example:
        flatten: false
        appearance:
          mode: signatureOnly
          contentType: image/png
          showWatermark: true
          showSignDate: true
    BlendMode:
      type: string
      title: BlendMode
      enum:
        - normal
        - multiply
        - screen
        - overlay
        - darken
        - lighten
        - colorDodge
        - colorBurn
        - hardLight
        - softLight
        - difference
        - exclusion
    IsCommentThreadRoot:
      title: isCommentThreadRoot
      type: boolean
      description: Indicates whether the annotation is the root of a comment thread.
    MarkupAnnotation:
      title: MarkupAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - title: MarkupAnnotation
          description: Markup annotations include highlight, squiggly, strikeout, and underline. All of these require a list of rectangles that they're drawn to. The highlight annotation will lay the color on top of the element and apply the multiply blend mode.
          type: object
          properties:
            type:
              enum:
                - pspdfkit/markup/highlight
                - pspdfkit/markup/squiggly
                - pspdfkit/markup/strikeout
                - pspdfkit/markup/underline
            rects:
              type: array
              description: Bounding boxes of the marked text.
              items:
                $ref: '#/components/schemas/Rect'
            blendMode:
              $ref: '#/components/schemas/BlendMode'
            color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: Foreground color
              example: '#fcee7c'
            note:
              $ref: '#/components/schemas/AnnotationNote'
            isCommentThreadRoot:
              $ref: '#/components/schemas/IsCommentThreadRoot'
          required:
            - rects
            - color
            - type
    AnnotationText:
      type: object
      description: The text contents.
      properties:
        format:
          type: string
          description: |-
            The format of the annotation's contents. Can be either `xhtml` or `plain`.
            If `xhtml` is used, the text will be rendered as XHTML.
            If `plain` is used, the text will be rendered as plain text.

            Supported XHTML tags include `span`, `p`, `html`, `body`, `b`, `i`, and `a`.
            Hyperlinks are also supported in the `a` tags using the `href` attribute.
            Styles are supported by using inline styles with the `style` attribute.
            Supported CSS properties include `background-color`, `font-weight`, `font-style`, `text-decoration`, `color`
          enum:
            - xhtml
            - plain
        value:
          type: string
          description: Actual text content of the annotation. This is the text that will be displayed in the annotation.
          example: Annotation with <b>xhtml</b> contents.
    FontSizeInt:
      title: FontSizeInt
      description: Size of the text in PDF points.
      type: integer
      example: 10
    FontStyle:
      type: array
      description: Text style. Can be only italic, only bold, italic and bold, or none of these.
      items:
        type: string
        enum:
          - bold
          - italic
    FontColor:
      title: FontColor
      type: string
      pattern: ^#[0-9a-fA-F]{6}$
      description: A foreground color of the text.
      example: '#ffffff'
    Font:
      title: Font
      type: string
      description: The font to render the text. Fonts are client specific, so you should only use fonts you know are present in the browser where they should be displayed. If a font isn't found, PSPDFKit will automatically fall back to a sans-serif font.
      example: Helvetica
    HorizontalAlign:
      title: HorizontalAlign
      type: string
      description: Alignment of the text along the horizontal axis.
      enum:
        - left
        - center
        - right
    VerticalAlign:
      title: VerticalAlign
      type: string
      description: |-
        Alignment of the text along the vertical axis.

        Note that vertical align is a custom PSPDFKit extension that might not be honored by 3rd party readers.
      enum:
        - top
        - center
        - bottom
    Point:
      type: array
      title: Point
      description: Point coordinates in a form [x, y] in PDF points (pt).
      items:
        type: number
        minItems: 2
        maxItems: 2
      example:
        - 100
        - 200
    LineCap:
      type: string
      title: LineCap
      enum:
        - square
        - circle
        - diamond
        - openArrow
        - closedArrow
        - butt
        - reverseOpenArrow
        - reverseClosedArrow
        - slash
    BorderStyle:
      type: string
      title: BorderStyle
      enum:
        - solid
        - dashed
        - beveled
        - inset
        - underline
    CloudyBorderIntensity:
      title: CloudyBorderIntensity
      type: number
      minimum: 0
    CloudyBorderInset:
      title: CloudyBorderInset
      description: Inset used for drawing cloudy borders in a form [left, top, right, bottom].
      type: array
      items:
        type: number
        minItems: 4
        maxItems: 4
    TextAnnotation:
      title: TextAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - title: TextAnnotation
          description: A text box annotation that can be placed anywhere on the screen.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/text
            text:
              $ref: '#/components/schemas/AnnotationText'
            fontSize:
              $ref: '#/components/schemas/FontSizeInt'
            fontStyle:
              $ref: '#/components/schemas/FontStyle'
            fontColor:
              $ref: '#/components/schemas/FontColor'
            font:
              $ref: '#/components/schemas/Font'
            backgroundColor:
              title: BackgroundColor
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: A background color that will fill the bounding box.
              example: '#000000'
            horizontalAlign:
              $ref: '#/components/schemas/HorizontalAlign'
            verticalAlign:
              $ref: '#/components/schemas/VerticalAlign'
            rotation:
              $ref: '#/components/schemas/AnnotationRotation'
            isFitting:
              type: boolean
              description: Specifies that the text is supposed to fit in the bounding box. This is only set on new annotations, as we can't easily figure out if an appearance stream contains all the text for existing annotations.
            callout:
              type: object
              description: Properties for callout version of text annotation.
              properties:
                start:
                  $ref: '#/components/schemas/Point'
                end:
                  $ref: '#/components/schemas/Point'
                innerRectInset:
                  type: array
                  description: Inset applied to the bounding box to size and position the rectangle for the text [left, top, right, bottom].
                  items:
                    type: number
                    minItems: 4
                    maxItems: 4
                cap:
                  $ref: '#/components/schemas/LineCap'
                knee:
                  $ref: '#/components/schemas/Point'
              required:
                - start
                - end
                - innerRectInset
            borderStyle:
              $ref: '#/components/schemas/BorderStyle'
            borderWidth:
              type: integer
              minimum: 0
            cloudyBorderIntensity:
              $ref: '#/components/schemas/CloudyBorderIntensity'
            cloudyBorderInset:
              $ref: '#/components/schemas/CloudyBorderInset'
          required:
            - type
            - text
            - fontSize
            - opacity
            - horizontalAlign
            - verticalAlign
    Intensity:
      title: Intensity
      type: number
      minimum: 0
      maximum: 1
      default: 0.5
    Lines:
      title: Lines
      type: object
      properties:
        intensities:
          type: array
          description: Intensities are used to weigh the point during natural drawing. They are received by pressure-sensitive drawing or touch devices. The default value should be used if it's not possible to obtain the intensity.
          items:
            type: array
            items:
              $ref: '#/components/schemas/Intensity'
        points:
          type: array
          description: Points are grouped in segments. Points inside a segment are joined to a line. There must be at least one  segment with at least one point.
          items:
            type: array
            items:
              $ref: '#/components/schemas/Point'
    BackgroundColor:
      title: BackgroundColor
      type: string
      pattern: ^#[0-9a-fA-F]{6}$
      description: A background color that will fill the bounding box.
      example: '#000000'
    InkAnnotation:
      title: InkAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - title: InkAnnotation
          description: Ink annotations are used for freehand drawings on a page. They can contain multiple line segments. Points within a segment are connected to a line.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/ink
            lines:
              $ref: '#/components/schemas/Lines'
            lineWidth:
              type: integer
              description: The width of the line in PDF points (pt).
              minimum: 0
            isDrawnNaturally:
              type: boolean
              description: Nutrient's natural drawing mode. This value is only used by Nutrient iOS SDK.
            isSignature:
              type: boolean
              description: True if the annotation should be considered a (soft) ink signature.
            strokeColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: The color of the line.
              example: '#ffffff'
            backgroundColor:
              $ref: '#/components/schemas/BackgroundColor'
            blendMode:
              $ref: '#/components/schemas/BlendMode'
            note:
              $ref: '#/components/schemas/AnnotationNote'
          required:
            - type
            - lines
            - lineWidth
    LinkAnnotation:
      title: LinkAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - title: LinkAnnotation
          description: A link can be used to trigger an action when clicked or pressed. The link will be drawn on the bounding box.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/link
            borderColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: A color of the link border.
              example: '#ffffff'
            borderStyle:
              $ref: '#/components/schemas/BorderStyle'
            borderWidth:
              type: integer
              minimum: 0
            note:
              $ref: '#/components/schemas/AnnotationNote'
          required:
            - type
            - action
    NoteIcon:
      title: NoteIcon
      type: string
      enum:
        - comment
        - rightPointer
        - rightArrow
        - check
        - circle
        - cross
        - insert
        - newParagraph
        - note
        - paragraph
        - help
        - star
        - key
    NoteAnnotation:
      title: NoteAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - title: NoteAnnotation
          description: Note annotations are “sticky notes” attached to a point in the PDF document. They're represented as markers, and each one has an icon associated with it. Its text content is revealed on selection.
          type: object
          properties:
            text:
              $ref: '#/components/schemas/AnnotationText'
            icon:
              $ref: '#/components/schemas/NoteIcon'
            color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: A color that fills the note shape and its icon.
              example: '#ffd83f'
          required:
            - type
            - text
            - icon
    MeasurementScale:
      title: MeasurementScale
      type: object
      properties:
        unitFrom:
          type: string
          enum:
            - in
            - mm
            - cm
            - pt
        unitTo:
          type: string
          enum:
            - in
            - mm
            - cm
            - pt
            - ft
            - m
            - yd
            - km
            - mi
        from:
          type: number
        to:
          type: number
    MeasurementPrecision:
      title: MeasurementPrecision
      type: string
      enum:
        - whole
        - oneDp
        - twoDp
        - threeDp
        - fourDp
    ShapeAnnotation:
      title: ShapeAnnotation
      description: Shape annotations are used to draw different shapes on a page.
      type: object
      properties:
        strokeDashArray:
          type: array
          items:
            type: number
        strokeWidth:
          type: number
        strokeColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          example: '#ffffff'
        note:
          $ref: '#/components/schemas/AnnotationNote'
        measurementScale:
          $ref: '#/components/schemas/MeasurementScale'
        measurementPrecision:
          $ref: '#/components/schemas/MeasurementPrecision'
    FillColor:
      title: FillColor
      type: string
      pattern: ^#[0-9a-fA-F]{6}$
      example: '#FF0000'
    EllipseAnnotation:
      title: EllipseAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - $ref: '#/components/schemas/ShapeAnnotation'
        - title: EllipseAnnotation
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/shape/ellipse
            fillColor:
              $ref: '#/components/schemas/FillColor'
            cloudyBorderIntensity:
              $ref: '#/components/schemas/CloudyBorderIntensity'
            cloudyBorderInset:
              $ref: '#/components/schemas/CloudyBorderInset'
          required:
            - type
    RectangleAnnotation:
      title: RectangleAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - $ref: '#/components/schemas/ShapeAnnotation'
        - title: RectangleAnnotation
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/shape/rectangle
            fillColor:
              $ref: '#/components/schemas/FillColor'
            cloudyBorderIntensity:
              $ref: '#/components/schemas/CloudyBorderIntensity'
            cloudyBorderInset:
              $ref: '#/components/schemas/CloudyBorderInset'
          required:
            - type
    LineCaps:
      title: LineCaps
      type: object
      properties:
        start:
          $ref: '#/components/schemas/LineCap'
        end:
          $ref: '#/components/schemas/LineCap'
    LineAnnotation:
      title: LineAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - $ref: '#/components/schemas/ShapeAnnotation'
        - title: LineAnnotation
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/shape/line
            startPoint:
              $ref: '#/components/schemas/Point'
            endPoint:
              $ref: '#/components/schemas/Point'
            fillColor:
              $ref: '#/components/schemas/FillColor'
            lineCaps:
              $ref: '#/components/schemas/LineCaps'
          required:
            - type
            - startPoint
            - endPoint
    PolylineAnnotation:
      title: PolylineAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - $ref: '#/components/schemas/ShapeAnnotation'
        - title: PolylineAnnotation
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/shape/polyline
            fillColor:
              $ref: '#/components/schemas/FillColor'
            points:
              type: array
              items:
                $ref: '#/components/schemas/Point'
            lineCaps:
              $ref: '#/components/schemas/LineCaps'
            cloudyBorderIntensity:
              $ref: '#/components/schemas/CloudyBorderIntensity'
            cloudyBorderInset:
              $ref: '#/components/schemas/CloudyBorderInset'
          required:
            - type
            - points
    PolygonAnnotation:
      title: PolygonAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - $ref: '#/components/schemas/ShapeAnnotation'
        - title: PolygonAnnotation
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/shape/polygon
            fillColor:
              $ref: '#/components/schemas/FillColor'
            points:
              type: array
              items:
                $ref: '#/components/schemas/Point'
            cloudyBorderIntensity:
              $ref: '#/components/schemas/CloudyBorderIntensity'
          required:
            - type
            - points
    ImageAnnotation:
      title: ImageAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - title: ImageAnnotation
          description: Image annotations are used to annotate a PDF with images.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/image
            description:
              type: string
              description: A description of the image.
              example: PSPDFKit Logo
            fileName:
              type: string
              description: An optional file name for the image.
            contentType:
              type: string
              description: MIME type of the image.
              enum:
                - image/jpeg
                - image/png
                - application/pdf
            imageAttachmentId:
              type: string
              description: Either the SHA256 hash of the attachment or the pdfObjectId of the attachment.
            rotation:
              $ref: '#/components/schemas/AnnotationRotation'
            isSignature:
              type: boolean
              description: True if the annotation should be considered a (soft) signature.
            note:
              $ref: '#/components/schemas/AnnotationNote'
          required:
            - type
    StampAnnotation:
      title: StampAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - title: StampAnnotation
          description: A stamp annotation represents a stamp in a PDF.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/stamp
            stampType:
              type: string
              description: A type defining the appearance of the stamp annotation. Type 'Custom' displays arbitrary title and subtitle.
              enum:
                - Accepted
                - Approved
                - AsIs
                - Completed
                - Confidential
                - Departmental
                - Draft
                - Experimental
                - Expired
                - Final
                - ForComment
                - ForPublicRelease
                - InformationOnly
                - InitialHere
                - NotApproved
                - NotForPublicRelease
                - PreliminaryResults
                - Rejected
                - Revised
                - SignHere
                - Sold
                - TopSecret
                - Void
                - Witness
                - Custom
            title:
              type: string
              description: Custom stamp's title.
            subtitle:
              type: string
              description: Custom stamp's subtitle.
            color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: Custom stamp's fill color.
              example: '#ffffff'
            rotation:
              $ref: '#/components/schemas/AnnotationRotation'
            note:
              $ref: '#/components/schemas/AnnotationNote'
          required:
            - type
            - stampType
    FontSizeAuto:
      title: FontSizeAuto
      description: Size of the text that automatically adjusts to fit the bounding box.
      type: string
      enum:
        - auto
      example: auto
    WidgetAnnotation:
      title: WidgetAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - title: WidgetAnnotation
          description: JSON representation of the form field widget annotation. Widget annotations are a type of annotation with the type always being 'pspdfkit/widget'.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/widget
            formFieldName:
              type: string
              example: First-Name
              description: See name property of the FormField schema for more details
            borderColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: A color of the annotation border.
              example: '#ffffff'
            borderStyle:
              $ref: '#/components/schemas/BorderStyle'
            borderWidth:
              type: integer
              minimum: 0
            font:
              $ref: '#/components/schemas/Font'
            fontSize:
              oneOf:
                - $ref: '#/components/schemas/FontSizeInt'
                - $ref: '#/components/schemas/FontSizeAuto'
            fontColor:
              $ref: '#/components/schemas/FontColor'
            fontStyle:
              $ref: '#/components/schemas/FontStyle'
            horizontalAlign:
              $ref: '#/components/schemas/HorizontalAlign'
            verticalAlign:
              $ref: '#/components/schemas/VerticalAlign'
            rotation:
              $ref: '#/components/schemas/AnnotationRotation'
            backgroundColor:
              $ref: '#/components/schemas/BackgroundColor'
            contentType:
              type: string
              description: MIME type of the widget attachment.
              enum:
                - image/jpeg
                - image/png
                - application/pdf
            widgetAttachmentId:
              type: string
              description: SHA256 hash of the widget attachment.
          required:
            - type
    CommentMarkerAnnotation:
      title: CommentMarkerAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation'
        - title: CommentMarkerAnnotation
          description: Comment markers are annotations attached to a point in the PDF document that can be a root of a comment thread. They're represented as markers, and each one has an icon associated with it. Its text content match the content of the first comment in the thread.
          type: object
          properties:
            text:
              $ref: '#/components/schemas/AnnotationText'
            icon:
              $ref: '#/components/schemas/NoteIcon'
            color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: A color that fills the note shape and its icon.
              example: '#ffd83f'
            isCommentThreadRoot:
              $ref: '#/components/schemas/IsCommentThreadRoot'
          required:
            - type
            - icon
    Annotation:
      title: Annotation JSON v2
      type: object
      description: JSON representation of an annotation.
      oneOf:
        - $ref: '#/components/schemas/MarkupAnnotation'
        - $ref: '#/components/schemas/RedactionAnnotation'
        - $ref: '#/components/schemas/TextAnnotation'
        - $ref: '#/components/schemas/InkAnnotation'
        - $ref: '#/components/schemas/LinkAnnotation'
        - $ref: '#/components/schemas/NoteAnnotation'
        - $ref: '#/components/schemas/EllipseAnnotation'
        - $ref: '#/components/schemas/RectangleAnnotation'
        - $ref: '#/components/schemas/LineAnnotation'
        - $ref: '#/components/schemas/PolylineAnnotation'
        - $ref: '#/components/schemas/PolygonAnnotation'
        - $ref: '#/components/schemas/ImageAnnotation'
        - $ref: '#/components/schemas/StampAnnotation'
        - $ref: '#/components/schemas/WidgetAnnotation'
        - $ref: '#/components/schemas/CommentMarkerAnnotation'
    BaseAnnotation.v1:
      title: BaseAnnotation
      type: object
      properties:
        v:
          type: integer
          enum:
            - 1
          description: The specification version that the record is compliant to.
        type:
          type: string
          description: The type of the annotation.
        pageIndex:
          type: integer
          description: Page index of the annotation. 0 is the first page.
          minimum: 0
        bbox:
          $ref: '#/components/schemas/AnnotationBbox'
        action:
          $ref: '#/components/schemas/Action'
        opacity:
          type: number
          description: Annotation opacity. 0 is fully transparent, 1 is fully opaque.
          minimum: 0
          maximum: 1
        pdfObjectId:
          type: integer
          description: The PDF object ID of the annotation from the source PDF.
        id:
          type: string
          description: The unique Instant JSON identifier of the annotation.
          example: 01DNEDPQQ22W49KDXRFPG4EPEQ
        flags:
          type: array
          description: |-
            Array of annotation flags.

            | Flag | Description |
            | ---- | ----------- |
            | noPrint | Don't print. |
            | noZoom | Don't zoom with page. |
            | noRotate | Don't rotate. |
            | noView | Don't display, can be still printed. |
            | hidden | Don't display, don't print, disable any interaction with user. |
            | invisible | Ignore annotation AP stream. |
            | readOnly | Don't allow the annotation to be deleted or its properties modified. |
            | locked | Same as `readOnly` but allows changing annotation contents. |
            | lockedContents | Don't allow the contents of the annotation to be modified. |
          items:
            type: string
            enum:
              - noPrint
              - noZoom
              - noRotate
              - noView
              - hidden
              - invisible
              - readOnly
              - locked
              - toggleNoView
              - lockedContents
        createdAt:
          type: string
          description: The date of the annotation creation. ISO 8601 with full date, time, and time zone information
          format: date-time
          example: '2019-09-16T15:05:03.712909Z'
        updatedAt:
          type: string
          description: The date of the last annotation update. ISO 8601 with full date, time, and time zone information
          format: date-time
          example: '2019-09-16T15:05:03.712909Z'
        name:
          type: string
          description: The name of the annotation used to identify the annotation.
        creatorName:
          type: string
          description: The name of the creator of the annotation.
        customData:
          $ref: '#/components/schemas/AnnotationCustomData'
      required:
        - type
        - pageIndex
        - bbox
        - v
    MarkupAnnotation.v1:
      title: MarkupAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - title: MarkupAnnotation
          description: Markup annotations include highlight, squiggly, strikeout, and underline. All of these require a list of rectangles that they're drawn to. The highlight annotation will lay the color on top of the element and apply the multiply blend mode.
          type: object
          properties:
            type:
              enum:
                - pspdfkit/markup/highlight
                - pspdfkit/markup/squiggly
                - pspdfkit/markup/strikeout
                - pspdfkit/markup/underline
            rects:
              type: array
              description: Bounding boxes of the marked text.
              items:
                $ref: '#/components/schemas/Rect'
            blendMode:
              $ref: '#/components/schemas/BlendMode'
            color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: Foreground color
              example: '#fcee7c'
            note:
              $ref: '#/components/schemas/AnnotationNote'
            isCommentThreadRoot:
              $ref: '#/components/schemas/IsCommentThreadRoot'
          required:
            - rects
            - color
            - type
    RedactionAnnotation.v1:
      title: RedactionAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - title: RedactionAnnotation
          description: Redaction annotations determines the location of the area marked for redaction.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/markup/redaction
            rects:
              type: array
              description: Bounding boxes of the marked text.
              items:
                $ref: '#/components/schemas/Rect'
            outlineColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: Outline color is the border color of a redaction annotation when it hasn't yet been applied to the document
              example: '#ffffff'
            fillColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: Fill color is the background color that a redaction will have when applied to the document.
            overlayText:
              type: string
              description: The text that will be printed on top of an applied redaction annotation.
              example: CONFIDENTIAL
            repeatOverlayText:
              type: boolean
              description: Specifies whether or not the overlay text will be repeated multiple times to fill the boundaries of the redaction annotation.
            color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: Color of the overlay text (if any).
              example: '#ffffff'
            rotation:
              $ref: '#/components/schemas/AnnotationRotation'
            note:
              $ref: '#/components/schemas/AnnotationNote'
          required:
            - type
    AnnotationPlainText:
      type: string
      description: The text contents.
      example: Annotation text.
    TextAnnotation.v1:
      title: TextAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - title: TextAnnotation
          description: A text box annotation that can be placed anywhere on the screen.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/text
            text:
              $ref: '#/components/schemas/AnnotationPlainText'
            fontSize:
              $ref: '#/components/schemas/FontSizeInt'
            fontStyle:
              type: array
              description: Text style. Can be only italic, only bold, italic and bold, or none of these.
              items:
                type: string
                enum:
                  - bold
                  - italic
            fontColor:
              $ref: '#/components/schemas/FontColor'
            font:
              $ref: '#/components/schemas/Font'
            backgroundColor:
              title: BackgroundColor
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: A background color that will fill the bounding box.
              example: '#000000'
            horizontalAlign:
              $ref: '#/components/schemas/HorizontalAlign'
            verticalAlign:
              $ref: '#/components/schemas/VerticalAlign'
            rotation:
              $ref: '#/components/schemas/AnnotationRotation'
            isFitting:
              type: boolean
              description: Specifies that the text is supposed to fit in the bounding box. This is only set on new annotations, as we can't easily figure out if an appearance stream contains all the text for existing annotations.
            callout:
              type: object
              description: Properties for callout version of text annotation.
              properties:
                start:
                  $ref: '#/components/schemas/Point'
                end:
                  $ref: '#/components/schemas/Point'
                innerRectInset:
                  type: array
                  description: Inset applied to the bounding box to size and position the rectangle for the text [left, top, right, bottom].
                  items:
                    type: number
                    minItems: 4
                    maxItems: 4
                cap:
                  $ref: '#/components/schemas/LineCap'
                knee:
                  $ref: '#/components/schemas/Point'
              required:
                - start
                - end
                - innerRectInset
            borderStyle:
              $ref: '#/components/schemas/BorderStyle'
            borderWidth:
              type: integer
              minimum: 0
            cloudyBorderIntensity:
              $ref: '#/components/schemas/CloudyBorderIntensity'
            cloudyBorderInset:
              $ref: '#/components/schemas/CloudyBorderInset'
          required:
            - type
            - text
            - fontSize
    InkAnnotation.v1:
      title: InkAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - title: InkAnnotation
          description: Ink annotations are used for freehand drawings on a page. They can contain multiple line segments. Points within a segment are connected to a line.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/ink
            lines:
              $ref: '#/components/schemas/Lines'
            lineWidth:
              type: integer
              description: The width of the line in PDF points (pt).
              minimum: 0
            isDrawnNaturally:
              type: boolean
              description: Nutrient's natural drawing mode. This value is only used by Nutrient iOS SDK.
            isSignature:
              type: boolean
              description: True if the annotation should be considered a (soft) ink signature.
            strokeColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: The color of the line.
              example: '#ffffff'
            backgroundColor:
              $ref: '#/components/schemas/BackgroundColor'
            blendMode:
              $ref: '#/components/schemas/BlendMode'
            note:
              $ref: '#/components/schemas/AnnotationNote'
          required:
            - type
            - lines
            - lineWidth
    LinkAnnotation.v1:
      title: LinkAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - title: LinkAnnotation
          description: A link can be used to trigger an action when clicked or pressed. The link will be drawn on the bounding box.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/link
            borderColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: A color of the link border.
              example: '#ffffff'
            borderStyle:
              $ref: '#/components/schemas/BorderStyle'
            borderWidth:
              type: integer
              minimum: 0
            note:
              $ref: '#/components/schemas/AnnotationNote'
          required:
            - type
            - action
    NoteAnnotation.v1:
      title: NoteAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - title: NoteAnnotation
          description: Note annotations are “sticky notes” attached to a point in the PDF document. They're represented as markers, and each one has an icon associated with it. Its text content is revealed on selection.
          type: object
          properties:
            text:
              $ref: '#/components/schemas/AnnotationPlainText'
            icon:
              $ref: '#/components/schemas/NoteIcon'
            color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: A color that fills the note shape and its icon.
              example: '#ffd83f'
          required:
            - type
            - text
            - icon
    ShapeAnnotation.v1:
      title: ShapeAnnotation
      description: Shape annotations are used to draw different shapes on a page.
      type: object
      properties:
        strokeDashArray:
          type: array
          items:
            type: number
        strokeWidth:
          type: number
        strokeColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          example: '#ffffff'
        note:
          $ref: '#/components/schemas/AnnotationNote'
        measurementScale:
          $ref: '#/components/schemas/MeasurementScale'
        measurementPrecision:
          $ref: '#/components/schemas/MeasurementPrecision'
    EllipseAnnotation.v1:
      title: EllipseAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - $ref: '#/components/schemas/ShapeAnnotation.v1'
        - title: EllipseAnnotation
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/shape/ellipse
            fillColor:
              $ref: '#/components/schemas/FillColor'
            cloudyBorderIntensity:
              $ref: '#/components/schemas/CloudyBorderIntensity'
            cloudyBorderInset:
              $ref: '#/components/schemas/CloudyBorderInset'
          required:
            - type
    RectangleAnnotation.v1:
      title: RectangleAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - $ref: '#/components/schemas/ShapeAnnotation.v1'
        - title: RectangleAnnotation
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/shape/rectangle
            fillColor:
              $ref: '#/components/schemas/FillColor'
            cloudyBorderIntensity:
              $ref: '#/components/schemas/CloudyBorderIntensity'
            cloudyBorderInset:
              $ref: '#/components/schemas/CloudyBorderInset'
          required:
            - type
    LineAnnotation.v1:
      title: LineAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - $ref: '#/components/schemas/ShapeAnnotation.v1'
        - title: LineAnnotation
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/shape/line
            startPoint:
              $ref: '#/components/schemas/Point'
            endPoint:
              $ref: '#/components/schemas/Point'
            fillColor:
              $ref: '#/components/schemas/FillColor'
            lineCaps:
              $ref: '#/components/schemas/LineCaps'
          required:
            - type
            - startPoint
            - endPoint
    PolylineAnnotation.v1:
      title: PolylineAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - $ref: '#/components/schemas/ShapeAnnotation.v1'
        - title: PolylineAnnotation
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/shape/polyline
            fillColor:
              $ref: '#/components/schemas/FillColor'
            points:
              type: array
              items:
                $ref: '#/components/schemas/Point'
            lineCaps:
              $ref: '#/components/schemas/LineCaps'
            cloudyBorderIntensity:
              $ref: '#/components/schemas/CloudyBorderIntensity'
            cloudyBorderInset:
              $ref: '#/components/schemas/CloudyBorderInset'
          required:
            - type
            - points
    PolygonAnnotation.v1:
      title: PolygonAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - $ref: '#/components/schemas/ShapeAnnotation.v1'
        - title: PolygonAnnotation
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/shape/polygon
            fillColor:
              $ref: '#/components/schemas/FillColor'
            points:
              type: array
              items:
                $ref: '#/components/schemas/Point'
            cloudyBorderIntensity:
              $ref: '#/components/schemas/CloudyBorderIntensity'
          required:
            - type
            - points
    ImageAnnotation.v1:
      title: ImageAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - title: ImageAnnotation
          description: Image annotations are used to annotate a PDF with images.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/image
            description:
              type: string
              description: A description of the image.
              example: PSPDFKit Logo
            fileName:
              type: string
              description: An optional file name for the image.
            contentType:
              type: string
              description: MIME type of the image.
              enum:
                - image/jpeg
                - image/png
                - application/pdf
            imageAttachmentId:
              type: string
              description: Either the SHA256 hash of the attachment or the pdfObjectId of the attachment.
            rotation:
              $ref: '#/components/schemas/AnnotationRotation'
            isSignature:
              type: boolean
              description: True if the annotation should be considered a (soft) signature.
            note:
              $ref: '#/components/schemas/AnnotationNote'
          required:
            - type
    StampAnnotation.v1:
      title: StampAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - title: StampAnnotation
          description: A stamp annotation represents a stamp in a PDF.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/stamp
            stampType:
              type: string
              description: A type defining the appearance of the stamp annotation. Type 'Custom' displays arbitrary title and subtitle.
              enum:
                - Accepted
                - Approved
                - AsIs
                - Completed
                - Confidential
                - Departmental
                - Draft
                - Experimental
                - Expired
                - Final
                - ForComment
                - ForPublicRelease
                - InformationOnly
                - InitialHere
                - NotApproved
                - NotForPublicRelease
                - PreliminaryResults
                - Rejected
                - Revised
                - SignHere
                - Sold
                - TopSecret
                - Void
                - Witness
                - Custom
            title:
              type: string
              description: Custom stamp's title.
            subtitle:
              type: string
              description: Custom stamp's subtitle.
            color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: Custom stamp's fill color.
              example: '#ffffff'
            rotation:
              $ref: '#/components/schemas/AnnotationRotation'
            note:
              $ref: '#/components/schemas/AnnotationNote'
          required:
            - type
            - stampType
    WidgetAnnotation.v1:
      title: WidgetAnnotation
      allOf:
        - $ref: '#/components/schemas/BaseAnnotation.v1'
        - title: WidgetAnnotation
          description: JSON representation of the form field widget annotation. Widget annotations are a type of annotation with the type always being 'pspdfkit/widget'.
          type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/widget
            formFieldName:
              type: string
              example: First-Name
              description: See name property of the FormFieldContent schema for more details
            borderColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: A color of the annotation border.
              example: '#ffffff'
            borderStyle:
              $ref: '#/components/schemas/BorderStyle'
            borderWidth:
              type: integer
              minimum: 0
            font:
              $ref: '#/components/schemas/Font'
            fontSize:
              oneOf:
                - $ref: '#/components/schemas/FontSizeInt'
                - $ref: '#/components/schemas/FontSizeAuto'
            fontColor:
              $ref: '#/components/schemas/FontColor'
            horizontalAlign:
              $ref: '#/components/schemas/HorizontalAlign'
            verticalAlign:
              $ref: '#/components/schemas/VerticalAlign'
            rotation:
              $ref: '#/components/schemas/AnnotationRotation'
            backgroundColor:
              $ref: '#/components/schemas/BackgroundColor'
            contentType:
              type: string
              description: MIME type of the widget attachment.
              enum:
                - image/jpeg
                - image/png
                - application/pdf
            widgetAttachmentId:
              type: string
              description: SHA256 hash of the widget attachment.
          required:
            - type
    Annotation.v1:
      title: Annotation JSON v1
      type: object
      description: JSON representation of an annotation.
      oneOf:
        - $ref: '#/components/schemas/MarkupAnnotation.v1'
        - $ref: '#/components/schemas/RedactionAnnotation.v1'
        - $ref: '#/components/schemas/TextAnnotation.v1'
        - $ref: '#/components/schemas/InkAnnotation.v1'
        - $ref: '#/components/schemas/LinkAnnotation.v1'
        - $ref: '#/components/schemas/NoteAnnotation.v1'
        - $ref: '#/components/schemas/EllipseAnnotation.v1'
        - $ref: '#/components/schemas/RectangleAnnotation.v1'
        - $ref: '#/components/schemas/LineAnnotation.v1'
        - $ref: '#/components/schemas/PolylineAnnotation.v1'
        - $ref: '#/components/schemas/PolygonAnnotation.v1'
        - $ref: '#/components/schemas/ImageAnnotation.v1'
        - $ref: '#/components/schemas/StampAnnotation.v1'
        - $ref: '#/components/schemas/WidgetAnnotation.v1'
    Attachment:
      title: Attachment
      description: |-
        Represents a binary "attachment" associated with an Annotation.

        For example, this might be an image attachment for `ImageAnnotation`.
      type: object
      properties:
        binary:
          type: string
          description: Base64-encoded binary data of the attachment.
        contentType:
          type: string
          description: MIME type of the attachment's content. For example, `image/png`.
    Attachments:
      title: Attachments
      description: |-
        Attachments are defined as an associative array.
        * Keys are SHA-256 hashes of the attachment contents or the `pdfObjectId`
        of the attachment (in case it's part of the source PDF).
        * Values are the actual `Attachment` objects with Base-64 encoded binary
        contents of the attachment and its content type.
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Attachment'
      example:
        388dd55f16b0b7ccdf7abdc7a0daea7872ef521de56ee820b4440e52c87d081b:
          binary: YXR0YWNobWVudCBjb250ZW50cwo=
          contentType: image/png
        ccbb4499fa6d9f003545fa43ec19511fdb7227ca505bba9f74d787dff57af77b:
          binary: YW5vdGhlciBhdHRhY2htZW50IGNvbnRlbnRzCg==
          contentType: plain/text
    BaseFormField:
      title: BaseFormField
      type: object
      properties:
        v:
          type: integer
          enum:
            - 1
          description: The specification version that the record is compliant to.
        type:
          type: string
          description: The type of the form field.
        id:
          type: string
          description: The unique Instant JSON identifier of the form field.
          example: 7KPSXX1NMNJ2WFDKN7BKQK9KZ
        name:
          type: string
          description: A unique identifier for the form field. This is not visible in the PDF.
          example: Form-Field
        label:
          type: string
          description: The visible name of the form field. It is used to identify the field in the UI for accessibility.
          example: Form Field
        annotationIds:
          type: array
          description: |-
            The list of Instant JSON identifiers of widget annotations that are associated with this form field.

            The widget annotation is used to define the visual appearance of the form field and
            to manage user interaction with the form field. Each interactive form control is
            associated with separate widget annotation.
          items:
            type: string
          example:
            - 01DNEDPQQ22W49KDXRFPG4EPEQ
            - 7KPS6T4DKYN71VB7G5KBGB5R51
        pdfObjectId:
          type: integer
          description: The PDF object ID of the form field from the source PDF.
        flags:
          type: array
          description: |-
            Array of form field flags.

            | Flag | Description |
            | ---- | ----------- |
            | readOnly | Field can't be filled. |
            | required | Field needs to have a value when exported by a submit-form action |
            | _noExport_ | _(Not supported) Field shall not be exported by a submit-form action. PSPDFKit will read this flag from the PDF and write back changes to its state, but otherwise this flag has no effect._ |
          items:
            type: string
            enum:
              - readOnly
              - required
              - noExport
          example:
            - required
      required:
        - annotationIds
        - label
        - name
        - type
        - v
    ButtonFormField:
      title: ButtonFormField
      description: A simple push button that responds immediately to user input without retaining any state.
      allOf:
        - $ref: '#/components/schemas/BaseFormField'
        - type: object
          title: ButtonFormField
          properties:
            type:
              type: string
              enum:
                - pspdfkit/form-field/button
            buttonLabel:
              type: string
              description: Specifies the 'normal' caption of the button
          required:
            - type
            - buttonLabel
    FormFieldOption:
      type: object
      description: A form option identifies a possible option for the form field.
      required:
        - label
        - value
      properties:
        label:
          type: string
          description: The label of the option.
          example: One
        value:
          type: string
          description: The export value of the option.
          example: Two
        annotationId:
          type: string
          description: |-
            The ID of the widget annotation this option is mapped to.
            Required for `CheckBoxFormField` and `RadioButtonFormField` options.
            Must reference one of the IDs in the form field's `annotationIds` array.
    FormFieldOptions:
      type: array
      description: |-
        The list of form field options.

        For `CheckBoxFormField` and `RadioButtonFormField`, each option must include
        an `annotationId` that maps it to a specific widget annotation. The number of
        options must equal the number of entries in `annotationIds`.

        For other form field types (`ListBoxFormField`, `ComboBoxFormField`), the index
        of the widget annotation ID in the `annotationIds` property corresponds to an
        index in the form field option array.
      items:
        $ref: '#/components/schemas/FormFieldOption'
      example:
        - label: MALE
          value: MALE
        - label: FEMALE
          value: FEMALE
    FormFieldDefaultValues:
      type: array
      description: Default values corresponding to each option.
      items:
        type: string
    FormFieldAdditionalActionsEvent:
      type: object
      description: Additional actions that can be performed on the form field.
      properties:
        onChange:
          allOf:
            - type: object
              description: Action to be performed when the field's value is changed.
            - $ref: '#/components/schemas/Action'
        onCalculate:
          allOf:
            - type: object
              description: Action to be performed to recalculate the value of a field.
            - $ref: '#/components/schemas/Action'
    ChoiceFormField:
      type: object
      properties:
        options:
          $ref: '#/components/schemas/FormFieldOptions'
        multiSelect:
          type: boolean
          description: |-
            If true, more than one of the field's option items may be selected
            simultaneously.
          default: false
        commitOnChange:
          type: boolean
          description: |-
            If true, the new value is committed as soon as a selection is made, without
            requiring the user to blur the field.
          default: false
        defaultValues:
          $ref: '#/components/schemas/FormFieldDefaultValues'
        additionalActions:
          $ref: '#/components/schemas/FormFieldAdditionalActionsEvent'
      required:
        - options
    FormFieldAdditionalActionsInput:
      type: object
      description: Additional actions that can be performed on the form field.
      properties:
        onInput:
          allOf:
            - type: object
              description: |-
                Action to be performed when the user types a key-stroke into a text
                field or combo box or modifies the selection in a scrollable list box.
            - $ref: '#/components/schemas/Action'
        onFormat:
          allOf:
            - type: object
              description: Action to be performed before the field is formatted to display its current value.
            - $ref: '#/components/schemas/Action'
    ListBoxFormField:
      title: ListBoxFormField
      description: A list box where multiple values can be selected.
      allOf:
        - $ref: '#/components/schemas/BaseFormField'
        - $ref: '#/components/schemas/ChoiceFormField'
        - type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/form-field/listbox
            additionalActions:
              allOf:
                - $ref: '#/components/schemas/FormFieldAdditionalActionsEvent'
                - $ref: '#/components/schemas/FormFieldAdditionalActionsInput'
    ComboBoxFormField:
      title: ComboBoxFormField
      description: A combo box is a drop-down box with the option add custom entries (see `edit`).
      allOf:
        - $ref: '#/components/schemas/BaseFormField'
        - $ref: '#/components/schemas/ChoiceFormField'
        - type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/form-field/combobox
            edit:
              type: boolean
              description: If true, the combo box includes an editable text box as well as a dropdown list. If false, it includes only a drop-down list.
              default: false
            doNotSpellCheck:
              type: boolean
              description: If true, the text entered in the field is not spell-checked.
              default: false
          required:
            - edit
            - doNotSpellCheck
    CheckboxFormField:
      title: CheckBoxFormField
      description: |-
        A check box that can either be checked or unchecked. One check box form field can also be associated to multiple single check box widgets.

        When creating a checkbox form field with multiple widgets, each entry in `options` must include
        an `annotationId` property that maps the option to its corresponding widget annotation.
      allOf:
        - $ref: '#/components/schemas/BaseFormField'
        - type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/form-field/checkbox
            options:
              $ref: '#/components/schemas/FormFieldOptions'
            defaultValues:
              $ref: '#/components/schemas/FormFieldDefaultValues'
            additionalActions:
              $ref: '#/components/schemas/FormFieldAdditionalActionsEvent'
          required:
            - type
            - options
            - defaultValues
    FormFieldDefaultValue:
      type: string
      description: Default value of the form field.
    RadioButtonFormField:
      title: RadioButtonFormField
      description: |-
        A group of radio buttons. Similar to `CheckBoxFormField`, but there can only be one value set at the same time.

        When creating a radio button form field, each entry in `options` must include
        an `annotationId` property that maps the option to its corresponding widget annotation.
      allOf:
        - $ref: '#/components/schemas/BaseFormField'
        - type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/form-field/radio
            options:
              $ref: '#/components/schemas/FormFieldOptions'
            defaultValue:
              $ref: '#/components/schemas/FormFieldDefaultValue'
            noToggleToOff:
              type: boolean
              description: |-
                If true, exactly one radio button must be selected at all times.
                Clicking the currently selected button has no effect. Otherwise,
                clicking the selected button deselects it, leaving no button selected.
              default: false
            radiosInUnison:
              type: boolean
              description: |-
                If true, a group of radio buttons within a radio button field that use
                the same value for the on state will turn on and off in unions: If one is
                checked, they are all checked (the same behavior as HTML radio buttons).
                Otherwise, only the checked radio button will be marked checked.
              default: false
          required:
            - type
            - options
            - defaultValues
    TextFormField:
      title: TextFormField
      description: A text input element, that can either span a single or multiple lines.
      allOf:
        - $ref: '#/components/schemas/BaseFormField'
        - type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/form-field/text
            password:
              type: boolean
              description: |-
                If true, the field is intended for entering a secure password that should not be echoed visibly
                 to the screen. Characters typed from the keyboard should instead be echoed in some unreadable
                 form, such as asterisks or bullet characters.
              default: false
            maxLength:
              type: integer
              minimum: 0
              description: The maximum length of the field's text, in characters. If none is set, the size is not limited.
            doNotSpellCheck:
              type: boolean
              description: If true, the text entered in the field is not spell-checked.
              default: false
            doNotScroll:
              type: boolean
              description: |-
                If true, the field does not scroll (horizontally for single-line fields, vertically for multiple-line fields)
                to accommodate more text than fits within its widget annotation's rectangle. Once the field is full, no further
                text is accepted.
              default: false
            multiLine:
              type: boolean
              description: If true, the field can contain multiple lines of text. Otherwise, the field's text is restricted to a single line.
              default: false
            comb:
              type: boolean
              description: |-
                If true, every character will have an input element on their own which is evenly distributed inside
                the bounding box of the widget annotation. When this is set, the form field must have a `maxLength``.
              default: false
            defaultValue:
              $ref: '#/components/schemas/FormFieldDefaultValue'
            richText:
              type: boolean
              default: false
              description: _(Not Supported) Rich text rendering is not supported right now. Any rich text value will be displayed as plain text in case the regular text value is missing._
            richTextValue:
              type: string
              description: _(Not Supported) Rich text rendering is not supported right now. Any rich text value will be displayed as plain text in case the regular text value is missing._
            additionalActions:
              allOf:
                - $ref: '#/components/schemas/FormFieldAdditionalActionsEvent'
                - $ref: '#/components/schemas/FormFieldAdditionalActionsInput'
          required:
            - type
            - doNotSpellCheck
            - doNotScroll
            - multiLine
            - comb
            - defaultValue
    SignatureFormField:
      title: SignatureFormField
      description: A field that contains a digital signature.
      allOf:
        - $ref: '#/components/schemas/BaseFormField'
        - type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/form-field/signature
    UnknownFormField:
      title: UnknownFormField
      description: A form field of unknown or unsupported type. Contains only the basic form field properties without any type-specific data.
      allOf:
        - $ref: '#/components/schemas/BaseFormField'
        - type: object
          properties:
            type:
              type: string
              enum:
                - pspdfkit/form-field/unknown
    FormField:
      title: Form field JSON
      type: object
      description: JSON representation of a form field
      oneOf:
        - $ref: '#/components/schemas/ButtonFormField'
        - $ref: '#/components/schemas/ListBoxFormField'
        - $ref: '#/components/schemas/ComboBoxFormField'
        - $ref: '#/components/schemas/CheckboxFormField'
        - $ref: '#/components/schemas/RadioButtonFormField'
        - $ref: '#/components/schemas/TextFormField'
        - $ref: '#/components/schemas/SignatureFormField'
        - $ref: '#/components/schemas/UnknownFormField'
    FormFieldValue:
      title: FormFieldValue
      description: |-
        A record representing a form field value.

        ## Choice Fields

        When creating form fields with multiple widgets like `CheckBoxFormField` or `RadioButtonFormField`, you need to ensure two things:
        - The number of annotations in the `annotationIds` field must be equal to the number of elements in the `options` field.
        - For each option in `options` you need to specify the `annotationId` that is mapped to this specific option on the PDF.

        The list of `options` in a `CheckBoxFormField` or `RadioButtonFormField` are the names of the `ON` state appearance
        of each widget annotation that is a child of the form field. The `options` array and the `annotationWidgetIds`
        array keep the same order, that is, the `ON` state appearance name for `annotationIds[0]` is in `options[0]`.
        The value of the `OFF` state is customizable but always has the same name, "Off", so it's not included in the model.

        In order to check a checkbox or radio button, if the `options` list contains, for example, `["Checked"]`,
        then you need to and pass the same list. The system will internally notice that you are setting the form
        value of a checkbox or radio button and automatically interpret "Checked" not as text, but as the PDF name
        that represents an appearance stream named "Checked", representing the ON state.

        The same applies to the OFF state, which by design always has the name "Off", as explained previously.
      type: object
      required:
        - type
        - name
        - v
      properties:
        name:
          type: string
          description: Unique name of the form field. This property is used to link form field value to a `FormField`.
        value:
          anyOf:
            - title: Single value
              type:
                - string
                - 'null'
              description: Value of the form field.
            - title: Multiple values
              type: array
              items:
                type: string
                description: |-
                  Values associated with the form field. Multiple values are allowed for
                  `ComboBoxFormField`, `ListBoxFormField` and `CheckBoxFormField`.
        type:
          type: string
          enum:
            - pspdfkit/form-field-value
        v:
          type: integer
          enum:
            - 1
          description: The specification version that the record is compliant to.
        optionIndexes:
          type: array
          description: |-
            Radio buttons and checkboxes can have multiple widgets with the same form value associated,
            but can be selected independently. `optionIndexes`` contains the value indexes that should be actually set.

            If set, the value field doesn't get used, and the widget found at the corresponding indexes in
            the form field's annotationIds property are checked.

            If set on fields other than `RadioButtonFormField` or `CheckBoxFormField`, setting the form value will fail.
          items:
            type: integer
        isFitting:
          type: boolean
          default: false
          description: Specifies if the given text should fit into the visible portion of the text form field.
    Bookmark:
      title: Bookmark
      description: A record representing a bookmark.
      type: object
      required:
        - type
        - v
        - action
      properties:
        name:
          type: string
          description: The optional bookmark name. This is used to identify the bookmark.
        type:
          type: string
          enum:
            - pspdfkit/bookmark
        v:
          type: integer
          enum:
            - 1
          description: The specification version that the record is compliant to.
        action:
          $ref: '#/components/schemas/Action'
        pdfBookmarkId:
          type: string
          description: The PDF object ID of the bookmark in the PDF.
    IsoDateTime:
      title: IsoDateTime
      type: string
      description: Date and time in ISO8601 format with timezone.
      example: '2019-09-16T15:05:03.712909Z'
    CustomData:
      title: CustomData
      type:
        - object
        - 'null'
      additionalProperties: true
      description: Object of arbitrary properties attached to an entity
    InstantComment.v2:
      title: Comment JSON v2
      type: object
      required:
        - type
        - text
        - pageIndex
        - v
        - rootId
      properties:
        type:
          type: string
          enum:
            - pspdfkit/comment
        pageIndex:
          $ref: '#/components/schemas/PageIndex'
        rootId:
          type: string
          description: The ID of the root annotation of the comment thread.
          example: 01HBDGR9D5JTFERPSCEMNH5GPG
        text:
          $ref: '#/components/schemas/AnnotationText'
        v:
          type: integer
          enum:
            - 2
          description: The instant JSON specification version that the record is compliant to.
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        creatorName:
          type: string
          description: The name of the user who created the comment.
          example: John Doe
        customData:
          $ref: '#/components/schemas/CustomData'
        pdfObjectId:
          $ref: '#/components/schemas/PdfObjectId'
        updatedAt:
          $ref: '#/components/schemas/IsoDateTime'
    InstantComment.v1:
      title: Comment JSON v1
      type: object
      required:
        - type
        - text
        - pageIndex
        - v
        - rootId
      properties:
        type:
          type: string
          enum:
            - pspdfkit/comment
        pageIndex:
          $ref: '#/components/schemas/PageIndex'
        rootId:
          type: string
          description: The ID of the root annotation of the comment thread.
          example: 01HBDGR9D5JTFERPSCEMNH5GPG
        text:
          type: string
          description: The text of the comment
          example: A comment is made of words
        v:
          type: integer
          enum:
            - 1
          description: The instant JSON specification version that the record is compliant to.
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        creatorName:
          type: string
          description: The name of the user who created the comment.
          example: John Doe
        customData:
          $ref: '#/components/schemas/CustomData'
        pdfObjectId:
          $ref: '#/components/schemas/PdfObjectId'
        updatedAt:
          $ref: '#/components/schemas/IsoDateTime'
    CommentContent:
      title: Comments JSON
      type: object
      description: JSON representation of a comment.
      oneOf:
        - $ref: '#/components/schemas/InstantComment.v2'
        - $ref: '#/components/schemas/InstantComment.v1'
  headers:
    x-pspdfkit-request-cost:
      description: Cost of the request in credits.
      schema:
        type: number
    x-pspdfkit-remaining-credits:
      description: |-
        Remaining credits after the request has been executed. Note that this
        value is only informational, as it doesn't include pending credit
        deductions on your account.
      schema:
        type: number
  responses:
    BuildResponseOk:
      description: |-
        The processing result. One of the following:
        * PDF file for `pdf` and `pdfa` output types.
        * Image file for `image` output types.
        * JSON with document contents for `json-content` output type.
        * Office file for `docx`, `xlsx`, and `pptx` output types.
      content:
        application/pdf:
          schema:
            type: string
            description: The processed PDF file. Returned in case of `pdf` and `pdfa` output types.
            format: binary
            example: <PDF file>
        application/json:
          schema:
            $ref: '#/components/schemas/BuildResponseJsonContents'
        application/jpeg:
          schema:
            type: string
            description: The rendered image file. Returned for `image` output type, `format` specified as `jpeg`, and only a single page rendered.
            format: binary
            example: <JPEG data>
        application/png:
          schema:
            type: string
            description: The rendered image file. Returned for `image` output type, `format` specified as `png`, and only a single page rendered.
            format: binary
            example: <PNG data>
        application/webp:
          schema:
            type: string
            description: The rendered image file. Returned for `image` output type, `format` specified as `webp`, and only a single page rendered.
            format: binary
            example: <WebP data>
        application/zip:
          schema:
            type: string
            description: An archive with rendered pages. Returned for `image` output type and multiple pages rendered.
            format: binary
            example: <ZIP data>
        application/vnd.openxmlformats-officedocument.wordprocessingml.document:
          schema:
            type: string
            description: Converted Office file. Returned for `docx` output type.
            format: binary
            example: <DOCX data>
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            description: Converted Office file. Returned for `xlsx` output type.
            format: binary
            example: <XLSX data>
        application/vnd.openxmlformats-officedocument.presentationml.presentation:
          schema:
            type: string
            description: Converted Office file. Returned for `pptx` output type.
            format: binary
            example: <PPTX data>
      headers:
        x-pspdfkit-request-cost:
          $ref: '#/components/headers/x-pspdfkit-request-cost'
        x-pspdfkit-remaining-credits:
          $ref: '#/components/headers/x-pspdfkit-remaining-credits'
  parameters:
    Password:
      in: header
      name: pspdfkit-pdf-password
      schema:
        type: string
        default: ''
      description: |-
        The PDF document password.

        The value can be either a plain-text password or a base64 encoded password in a form `base64:<encoded-password>`.
        Use the Base64 encoding if your password contains characters that are not allowed in HTTP header or would be otherwise mangled
        (e.g. trailing or leading spaces)

        If the document is password protected, any operations performed on it require supplying a password.
      examples:
        plainTextPassword:
          value: password
          summary: Plain-text password
        base64EncodedPassword:
          value: base64:Cg==
          summary: Base64 encoded password
x-tagGroups:
  - name: Endpoints
    tags:
      - Document Editing
      - Digital Signatures
      - AI
      - JWT
  - name: Account
    tags:
      - Account
  - name: Reference
    tags:
      - File Type Support
      - Build API
      - Instant JSON
      - OCR Language Support
