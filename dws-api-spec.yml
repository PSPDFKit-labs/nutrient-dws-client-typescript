  /processor/md_to_pdf:
    post:
      summary: Convert Markdown to PDF
      operationId: processor-md-to-pdf
      description: |-
        Convert markdown content to a styled PDF document.

        The conversion pipeline transforms Markdown into styled HTML (with syntax highlighting, GFM extensions,
        and optional custom CSS), then renders the HTML to PDF.

        This endpoint supports three content types:
        - **`application/json`** — JSON body with `markdown` field and optional options.
        - **`text/markdown`** — Raw Markdown body (no options, no images).
        - **`multipart/form-data`** — Markdown file + optional image assets + optional JSON options.

        Conversion is [CommonMark](https://spec.commonmark.org/0.31.2/)-compliant and supports
        [GFM](https://github.github.com/gfm/) extensions (tables, strikethrough, autolinks, task lists,
        alerts) plus footnotes, superscript/subscript, highlight, underline, and description lists.
      requestBody:
        content:
          text/markdown:
            schema:
              description: Raw Markdown content sent directly in the request body. No options are available with this content type
              type: string
              example: |-
                # Hello World

                This is **bold** and *italic*.
          application/json:
            schema:
              type: object
              required:
                - markdown
              properties:
                markdown:
                  type: string
                  description: 'The Markdown content to convert. Maximum size: 5 MB.'
                  example: |-
                    # Hello World

                    This is **bold** and *italic*.

                    | Name | Score |
                    |------|------:|
                    | Alice | 95 |
                template:
                  $ref: '#/components/schemas/BuiltInTemplate'
                css:
                  type: string
                  description: |-
                    Custom CSS appended after the template stylesheet. Use this to override or extend
                    the template styling. When no template is specified, the CSS is appended after
                    the default stylesheet.
                  example: 'body { font-family: Georgia, serif; } h1 { color: #2c3e50; }'
                layout:
                  $ref: '#/components/schemas/PageLayout'
                markdown_options:
                  $ref: '#/components/schemas/MarkdownOptions'
            example:
              markdown: |-
                # Report

                | Metric | Value |
                |--------|------:|
                | Revenue | $1.2M |

                See footnote[^1].

                [^1]: Q1 2026 figures.
              markdown_options:
                extensions:
                  table: true
                  footnotes: true
                syntax_highlight:
                  theme: github
          multipart/form-data:
            encoding:
              markdown:
                contentType: text/markdown
              data:
                contentType: application/json
              html:
                contentType: text/html
            schema:
              type: object
              required:
                - markdown
              properties:
                markdown:
                  type: string
                  format: binary
                  description: |-
                    The Markdown file to convert. Maximum size: 5 MB. Image references in the
                    Markdown (e.g. `![logo](logo.png)`) are resolved against uploaded asset parts.
                  example: <Markdown file>
                data:
                  type: object
                  description: Optional JSON object with conversion options. All fields are optional.
                  properties:
                    template:
                      $ref: '#/components/schemas/BuiltInTemplate'
                    css:
                      type: string
                      description: Custom CSS appended after the template stylesheet.
                    layout:
                      $ref: '#/components/schemas/PageLayout'
                    markdown_options:
                      $ref: '#/components/schemas/MarkdownOptions'
                html:
                  type: string
                  format: binary
                  description: |-
                    Optional inline HTML template file. When provided, this HTML wraps the rendered
                    Markdown instead of the default template. The rendered Markdown body is inserted
                    at the `{{content}}` placeholder. The `css` parameter is ignored when an inline
                    HTML template is provided.
                  example: <HTML template file>
              additionalProperties:
                type: string
                format: binary
                description: |-
                  Additional file parts are treated as image/asset uploads. The part name becomes
                  the asset filename, which can be referenced in Markdown via `![alt](filename)`.
      responses:
        '200':
          content:
            application/pdf:
              schema:
                description: The generated PDF document
                example: <PDF file>
                format: binary
                type: string
          description: The generated PDF document
          headers:
            x-pspdfkit-remaining-credits:
              $ref: '#/components/headers/x-pspdfkit-remaining-credits'
            x-pspdfkit-request-cost:
              $ref: '#/components/headers/x-pspdfkit-request-cost'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedErrorResponse'
          description: |-
            The request is malformed. Some invalid data was supplied, or a precondition wasn't met.

            Common causes:
            - Missing `markdown` field in JSON body or multipart request.
            - Invalid `markdown_options` (unknown extension, invalid theme name, etc.).
            - Invalid `layout` values (negative margins, unknown page size preset).
            - Malformed JSON in the `data` multipart part.
        '401':
          description: You are unauthorized. Sent when no API token is specified, or when the API token you specified isn't valid.
        '402':
          description: You have exceeded the total number of documents processed in your subscription.
        '408':
          description: The request timed out.
        '413':
          description: |-
            The request exceeds the maximum allowed size. The Markdown content is limited to 5 MB.
            The overall request body is subject to your plan's inbound size limit.
        '422':
          description: The request exceeds the maximum output file size.
        '500':
          description: An internal server error occurred. Please contact support.
      tags:
        - Document Editing
      x-codeSamples:
        - label: JSON
          lang: curl
          source: |
            curl -X POST https://api.nutrient.io/api/processor/md_to_pdf \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "markdown": "# Hello World\n\nThis is **bold** and *italic*.\n\n- Item one\n- Item two"
              }' \
              -o output.pdf
        - label: Raw Markdown
          lang: curl
          source: |
            curl -X POST https://api.nutrient.io/api/processor/md_to_pdf \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: text/markdown" \
              --data-binary @document.md \
              -o output.pdf
        - label: Multipart with images
          lang: curl
          source: |
            curl -X POST https://api.nutrient.io/api/processor/md_to_pdf \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -F markdown=@document.md \
              -F logo.png=@images/logo.png \
              -F diagram.svg=@images/diagram.svg \
              -o output.pdf
        - label: With options
          lang: curl
          source: |
            curl -X POST https://api.nutrient.io/api/processor/md_to_pdf \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "markdown": "# Styled Report\n\n| Name | Score |\n|------|------:|\n| Alice | 95 |",
                "template": "built-in:elegant",
                "css": "h1 { color: #2c3e50; }",
                "layout": {
                  "size": "Letter",
                  "orientation": "landscape",
                  "margin": {"top": 20, "right": 20, "bottom": 20, "left": 20}
                },
                "markdown_options": {
                  "extensions": {"table": true, "footnotes": true},
                  "syntax_highlight": {"theme": "github"}
                }
              }' \
              -o output.pdf
  /sign:
    post:
      summary: Digitally sign a PDF file
      description: Use this endpoint to digitally sign a PDF file.
      operationId: sign-file
      parameters:
        - $ref: '#/components/parameters/Password'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The binary content of a PDF file to be signed.
                  example: <PDF data>
                data:
                  $ref: '#/components/schemas/CreateDigitalSignature'
                  description: |
                    Optional signing parameters. If omitted, defaults will be used:
                    - `flatten`: `false`
                    - An invisible signature will be created
                image:
                  type: string
                  format: binary
                  description: The watermark image to be used as part of the signature's appearance. Optional.
                  example: <Image data>
                graphicImage:
                  type: string
                  format: binary
                  description: The graphic image to be used as part of the signature's appearance. Optional.
                  example: <Image data>
            encoding:
              file:
                contentType: application/pdf
              image:
                contentType: application/pdf, image/jpg, image/png, image/tiff
              graphicImage:
                contentType: application/pdf, image/jpg, image/png, image/tiff
              data:
                contentType: application/json
      responses:
        '200':
          description: The signed document.
          content:
            application/pdf:
              schema:
                type: string
                description: The signed PDF file.
                format: binary
                example: <PDF file>
          headers:
            x-pspdfkit-request-cost:
              $ref: '#/components/headers/x-pspdfkit-request-cost'
            x-pspdfkit-remaining-credits:
              $ref: '#/components/headers/x-pspdfkit-remaining-credits'
        '400':
          description: The request is malformed. Some invalid data was supplied, or a precondition wasn't met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedErrorResponse'
        '401':
          description: You are unauthorized. Sent when no API token is specified, or when the API token you specified isn't valid.
        '402':
          description: You have exceeded the total number of documents processed in your subscription.
        '408':
          description: The request timed out.
        '413':
          description: The request exceeds the maximum input size, meaning either a single part, or the sum of all parts, is large.
        '422':
          description: The request exceeds the maximum output file size.
        '500':
          description: An internal server error occurred. Please contact support.
      tags:
        - Digital Signatures
  /tokens:
    post:
      operationId: generate-token
      summary: Generate a new API token
      description: Use this endpoint to generate a new API token. All request body parameters are optional.
      tags:
        - JWT
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthTokenParameters'
      responses:
        '201':
          description: The generated API token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAuthTokenResponse'
        '400':
          description: The request is malformed. Some invalid data was supplied, or a precondition wasn't met.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        allowedOperations:
                          type: string
                          example: Description of error
                        allowedOrigins:
                          type: string
                          example: Description of error
                        expirationTime:
                          type: string
                          example: Description of error
    delete:
      operationId: revoke-token
      summary: Revoke an API token
      description: Use this endpoint to revoke an API token.
      tags:
        - JWT
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The ID of the token to revoke.
                  example: FCKGW-RHQQ2-YXRKT-8TG6W-2B7Q8
      responses:
        '204':
          description: The token was successfully revoked.
        '404':
          description: The token was not found.
  /account/info:
    get:
      summary: Get account information
      description: |-
        > This endpoint is deprecated. Please use `GET /account/{product}/usage` instead.

        Use this endpoint to get information about your account, such as the number of credits you have left.
      operationId: get-account-info
      deprecated: true
      responses:
        '200':
          description: Account information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  signedIn:
                    type: boolean
                    description: Whether you are signed in.
                    example: true
                  subscriptionType:
                    enum:
                      - free
                      - paid
                      - enterprise
                    description: Your subscription type.
                  usage:
                    type: object
                    description: Information about your usage.
                    properties:
                      totalCredits:
                        type: number
                        description: The number of credits available in the current billing period.
                        example: 100
                      usedCredits:
                        type: number
                        description: The number of credits you have used in the current billing period.
                        example: 50
        '401':
          description: You are unauthorized. Sent when no API token is specified, or when the API token you specified isn't valid.
      tags:
        - Account
  /account/{product}/usage:
    get:
      summary: Get usage for a product
      description: Use this endpoint to get subscription and usage counters for a specific product.
      operationId: get-account-product-usage
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: string
            enum:
              - processor
              - viewer
              - signing_workflow
              - accessibility
              - data_extraction
          description: Product slug matching `Hosted.Tenants.Model.Tenant.product/1`.
      responses:
        '200':
          description: Product subscription and usage information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    type: object
                    properties:
                      type:
                        anyOf:
                          - type: string
                            enum:
                              - free
                              - trial
                              - paid
                              - enterprise
                          - type: 'null'
                      status:
                        anyOf:
                          - type: string
                            enum:
                              - active
                              - inactive
                              - past_due
                              - paused
                              - deleted
                          - type: 'null'
                  usage:
                    type: object
                    properties:
                      counters:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              description: Service-specific usage counter identifier.
                            unit:
                              type: string
                              description: Unit of the counter (for example credits, pages, sessions, bytes).
                            used:
                              type:
                                - string
                                - 'null'
                              description: Current usage amount for the counter.
                            total:
                              type:
                                - string
                                - 'null'
                              description: Total allowance for the counter in the current period.
        '401':
          description: You are unauthorized. Sent when no API token is specified, or when the API token you specified isn't valid.
        '404':
          description: The requested product is unknown or not enabled for the authenticated organization.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - unknown_product
                      - product_not_found
      tags:
        - Account
  /ai/redact:
    post:
      summary: Redact sensitive information from a document
      operationId: ai-redact
      description: Redacts sensitive information from a document based on the provided criteria.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
                - file
              properties:
                data:
                  description: |
                    Parameters required for the redaction.
                  $ref: '#/components/schemas/RedactData'
                file:
                  type: string
                  format: binary
                  description: The PDF file to process.
                  example: <PDF data>
            encoding:
              data:
                contentType: application/json
              file:
                contentType: application/pdf
          application/json:
            schema:
              $ref: '#/components/schemas/RedactData'
      responses:
        '200':
          description: The redacted document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                description: The redacted PDF file
          headers:
            x-pspdfkit-request-cost:
              schema:
                type: number
                description: Cost of the request in credits
            x-pspdfkit-remaining-credits:
              schema:
                type: number
                description: Remaining credits after the request has been executed
        '400':
          description: The request is malformed. Some invalid data was supplied, or a precondition wasn't met.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  errors:
                    type: array
                    items:
                      type: object
        '401':
          description: You are unauthorized. Sent when no API token is specified, or when the API token you specified isn't valid.
        '402':
          description: You have exceeded the total number of documents processed in your subscription.
        '408':
          description: The request timed out.
        '413':
          description: The request exceeds the maximum input size, meaning either a single part, or the sum of all parts, is large.
        '422':
          description: The request exceeds the maximum output file size.
        '500':
          description: An internal server error occurred. Please contact support.
      tags:
        - AI
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
  schemas:
    AnalyzeBuildResponse:
      type: object
      properties:
        cost:
          type: number
          description: Total cost in credits charged after executing the request.
          minimum: 0
          example: 1.5
        required_features:
          type: object
          description: Usage statistics for all features required to execute the request.
          additionalProperties:
            type: object
            properties:
              unit_cost:
                type: number
                description: Credits cost per use of the feature.
                minimum: 0
                example: 0.5
              unit_type:
                type: string
                description: |-
                  Type of the unit used for billing. Possible values:

                  * `per_use` - `units` field represent number of uses of this particular feature in a Build request.
                  * `per_output_page` - `units` field represents number of pages of the Build request output.
                example: per_use
                enum:
                  - per_use
                  - per_output_page
              units:
                type: integer
                description: Number of feature uses in the request.
                minimum: 1
                example: 3
              cost:
                type: number
                description: Cost for feature uses in the request.
                minimum: 0
                example: 1.5
              usage:
                type: array
                description: JSON paths to the parts of instructions where the feature was used.
                items:
                  type: string
      example:
        cost: 3.5
        required_features:
          annotation_api:
            - unit_cost: 0.5
              unit_type: per_use
              units: 3
              cost: 1.5
              usage:
                - $.parts[0].actions[0]
                - $.parts[1].actions[1]
                - $.actions[0]
          document_editor_api:
            - unit_cost: 1
              unit_type: per_use
              units: 1
              cost: 1
              usage:
                - $.parts[1].merge
          ocr_api:
            - unit_cost: 2
              unit_type: per_use
              units: 1
              cost: 2
              usage:
                - $.parts[1].actions[0]
          pdf_to_pdfua_api:
            - unit_cost: 5
              unit_type: per_output_page
              units: 3
              cost: 15
              usage:
                - $.output
    InstantJson:
      title: Instant JSON
      description: Instant JSON is a format for bringing annotations and bookmarks into a modern format while keeping all important properties to make the Instant JSON spec work with PDF.
      type: object
      properties:
        format:
          type: string
          enum:
            - https://pspdfkit.com/instant-json/v1
        annotations:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/Annotation'
              - $ref: '#/components/schemas/Annotation.v1'
        attachments:
          $ref: '#/components/schemas/Attachments'
        formFields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
        formFieldValues:
          type: array
          items:
            $ref: '#/components/schemas/FormFieldValue'
        bookmarks:
          type: array
          items:
            $ref: '#/components/schemas/Bookmark'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentContent'
        skippedPdfObjectIds:
          type: array
          description: An array of PDF object IDs that should be skipped during the import process. Whenever an object ID is marked as skipped, it'll no longer be loaded from the original PDF. Instead, it could be defined inside the annotations array with the same pdfObjectId. If this is the case, the PDF viewer will display the new annotation, which signals an update to the original one. If an object ID is marked as skipped but the annotations array doesn't contain an annotation with the same pdfObjectId, it'll be interpreted as a deleted annotation. An annotation inside the annotations array without the pdfObjectId property is interpreted as a newly created annotation.
          items:
            type: integer
            minimum: 0
        pdfId:
          type: object
          description: PDF document identifiers, base64 encoded. This is used to track version of PDF document this JSON has been exported from.
          properties:
            permanent:
              type: string
              description: Permanent document identifier based on the contents of the file at the time it was originally created. Does not change when the file is saved incrementally.
              example: 9C3nLxNzQBuBBzv96LbdMg==
            changing:
              type: string
              description: Document identifier based on the file's contents at the time it was last updated.
              example: Oi+XccZpDHChV7I=
      required:
        - format
    CreateAuthTokenParameters:
      type: object
      properties:
        allowedOperations:
          type: array
          description: |-
            List of operations that can be performed with the generated token.
            Defaults to all operations.
          items:
            type: string
            enum:
              - annotations_api
              - compression_api
              - data_extraction_api
              - digital_signatures_api
              - document_editor_api
              - html_conversion_api
              - image_conversion_api
              - image_rendering_api
              - email_conversion_api
              - linearization_api
              - ocr_api
              - office_conversion_api
              - pdfa_api
              - pdf_to_office_conversion_api
              - redaction_api
          example:
            - digital_signatures_api
        allowedOrigins:
          type: array
          description: |-
            List of origins that can use the generated token.
            By default, allows all origins.
          items:
            type: string
            example: example.com
        expirationTime:
          type: integer
          default: 3600
          minimum: 1
          maximum: 86400
          description: The expiration time of the token in seconds. Must be between 1 and 86400 (24 hours).
    CreateAuthTokenResponse:
      type: object
      properties:
        id:
          type: string
          description: The ID of the generated token.
          example: a1b2c3d4-e5f6-g7h8-i9j0-k1l2m3n4o5p6
        accessToken:
          type: string
          description: The generated API token.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxMjM0NTY3ODkwLCJpYXQiOjE1MTYyMzkwMjJ9.4TJ4J7
    RedactData:
      type: object
      required:
        - documents
        - criteria
      properties:
        documents:
          type: array
          description: An array of documents to analyze for redaction.
          minItems: 1
          maxItems: 1
          items:
            type: object
            properties:
              file:
                oneOf:
                  - type: string
                    description: If the request is multipart/form-data, the name of the `file` key.
                  - type: object
                    properties:
                      url:
                        type: string
                        description: A URL pointing to a document to redact.
                    required:
                      - url
              pages:
                oneOf:
                  - type: array
                    items:
                      type: integer
                      minimum: 0
                    description: Array of page indices to analyze (0-based).
                  - type: object
                    properties:
                      start:
                        type: integer
                        minimum: 0
                        description: Starting page index (0-based).
                      end:
                        type: integer
                        description: |-
                          Ending page index. A positive number denotes an absolute page index,
                          negative number denotes a relative page index from the end of the document.
                    required:
                      - start
                      - end
                description: Optional. Limits the analysis to specific pages.
        criteria:
          type: string
          description: The redaction criteria such as "Redact all PII", or "All personal names and addresses", etc.
        redaction_state:
          type: string
          enum:
            - stage
            - apply
          default: stage
          description: When set to "stage", marks locations for redaction; when set to "apply", marks and removes content permanently. Optional, defaults to "stage".
        options:
          type: object
          description: Optional configuration for the redaction process.
          properties:
            confidence:
              type: object
              description: Configuration for confidence-based filtering of redactions.
              properties:
                threshold:
                  type: number
                  description: Optionally filter terms which are scored with a confidence level less than the threshold. Scores range from 1-10.
              required:
                - threshold
    UrlFileHandle:
      type: object
      title: Remote file
      description: Object pointing to remote file
      properties:
        url:
          type: string
          description: Specifies the URL from a file can be downloaded
          example: https://remote-file-storage/input-file
        sha256:
          type: string
          description: |-
            Optional parameter to verify a downloaded file using provided SHA256 hash.
            It is expected to be base16 encoded using lowercase.
      required:
        - url
    MultipartFileHandle:
      type: string
      title: Uploaded file
      description: Specifies the name of multipart part containing a file
      example: file-from-multipart
    FileHandle:
      oneOf:
        - $ref: '#/components/schemas/UrlFileHandle'
        - $ref: '#/components/schemas/MultipartFileHandle'
    PageRange:
      type: object
      description: |-
        Defines the range of pages in a document. The indexing starts from 0. It is possible
        to use negative numbers to refer to pages from the last page. For example, `-1` refers to the last page.
      properties:
        start:
          type: integer
          default: 0
        end:
          type: integer
          default: -1
    PageLayout:
      type: object
      description: Defines the layout of the generated pages.
      properties:
        orientation:
          type: string
          enum:
            - portrait
            - landscape
          description: The orientation of generated pages.
          default: portrait
        size:
          oneOf:
            - type: string
              title: Preset
              description: Page size preset.
              enum:
                - A0
                - A1
                - A2
                - A3
                - A4
                - A5
                - A6
                - A7
                - A8
                - Letter
                - Legal
            - type: object
              title: Custom
              description: The dimensions of generated pages.
              properties:
                width:
                  type: number
                  description: The width of pages in mm.
                  example: 210
                  minimum: 1
                height:
                  type: number
                  description: The height of pages in mm.
                  example: 297
                  minimum: 1
        margin:
          type: object
          description: The margins of generated pages. All dimensions are in mm.
          properties:
            left:
              type: number
              minimum: 0
              default: 0
            top:
              type: number
              minimum: 0
              default: 0
            right:
              type: number
              minimum: 0
              default: 0
            bottom:
              type: number
              minimum: 0
              default: 0
    ApplyInstantJsonAction:
      type: object
      required:
        - type
        - file
      properties:
        type:
          type: string
          description: Apply the Instant JSON to the document to import annotations or forms to a document.
          enum:
            - applyInstantJson
        file:
          $ref: '#/components/schemas/FileHandle'
    ApplyXfdfAction:
      type: object
      required:
        - type
        - file
      properties:
        type:
          type: string
          description: Apply the XFDF to the document to import annotations to a document.
          enum:
            - applyXfdf
        file:
          $ref: '#/components/schemas/FileHandle'
        ignorePageRotation:
          type: boolean
          default: false
          description: If `true`, ignores page rotation when applying XFDF data.
        richTextEnabled:
          type: boolean
          default: true
          description: |-
            If `true`, plain text annotations will be converted to rich text annotations.
            If `false`, all text annotations will be plain text annotations.
    FlattenAction:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Flatten the annotations in the document.
          enum:
            - flatten
        annotationIds:
          type: array
          description: |-
            Annotation IDs to flatten. These can be annotation IDs or `pdfObjectId`s.
            If not specified, all annotations will be flattened.
          items:
            oneOf:
