externalDocs:
  description: Nutrient DWS Processor API guides
  url: https://www.nutrient.io/guides/dws-processor/
paths:
  /build:
    post:
      operationId: build-document
      summary: Process documents
      description: |-
        This endpoint lets you use [Build instructions](#tag/Build-API) to process a document. This allows you to
        assemble a PDF from multiple parts, such as an existing document in a supported content type, a blank page,
        or an HTML page. You can apply one or more actions, such as watermarking, rotating pages, or importing
        annotations. Once the entire PDF is generated from its parts, you can also apply additional actions,
        such as optical character recognition (OCR), to the assembled PDF itself.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildInstructions'
          multipart/form-data:
            schema:
              type: object
              properties:
                instructions:
                  $ref: '#/components/schemas/BuildInstructions'
            encoding:
              instructions:
                contentType: application/json
      responses:
        '200':
          $ref: '#/components/responses/BuildResponseOk'
        '400':
          description: The request is malformed. Some invalid data was supplied, or a precondition wasn't met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedErrorResponse'
        '401':
          description: You are unauthorized. Sent when no API token is specified, or when the API token you specified isn't valid.
        '402':
          description: You have exceeded the total number of documents processed in your subscription.
        '408':
          description: The request timed out.
        '413':
          description: The request exceeds the maximum input size, meaning either a single part, or the sum of all parts, is large.
        '422':
          description: The request exceeds the maximum output file size.
        '500':
          description: An internal server error occurred. Please contact support.
      tags:
        - Document Editing
      x-codeSamples:
        - label: cURL
          lang: curl
          source: |
            curl --request POST \
              --url https://api.nutrient.io/build \
              --header 'Authorization: Bearer <your_api_key_here>' \
              --header 'content-type: application/json' \
              --data '{
              "parts": [{ "file": {"url": "https://remote-file-storage/input.pdf"}}],
              "actions": [{ "type": "applyInstantJson", "file": {"url": "https://remote-file-storage/instant.json" }}],
              "output": {
                "metadata": {
                  "title": "Nutrient Document Engine API Specification",
                  "author": "Document Author"
                },
                "labels": [{ "pages": [0], "label": "Page I-III" }],
                "user_password": "string",
                "owner_password": "string",
                "user_permissions": ["printing"],
                "type": "pdf"
              }
            }'
  /process_office_template:
    post:
      operationId: process-office-template
      summary: Populate a DOCX template
      description: This endpoint populates a DOCX template with JSON model data and returns the resulting DOCX document.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
                - model
              properties:
                document:
                  type: string
                  format: binary
                  description: The DOCX template to process.
                  example: <DOCX data>
                model:
                  $ref: '#/components/schemas/OfficeTemplateModel'
            encoding:
              document:
                contentType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
              model:
                contentType: application/json
      responses:
        '200':
          description: The populated DOCX document.
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                description: The processed document in DOCX format.
                format: binary
                example: <DOCX file>
          headers:
            x-pspdfkit-request-cost:
              $ref: '#/components/headers/x-pspdfkit-request-cost'
            x-pspdfkit-remaining-credits:
              $ref: '#/components/headers/x-pspdfkit-remaining-credits'
        '400':
          description: The request is malformed. Some invalid data was supplied, or a precondition wasn't met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedErrorResponse'
        '401':
          description: You are unauthorized. Sent when no API token is specified, or when the API token you specified isn't valid.
        '402':
          description: You have exceeded the total number of documents processed in your subscription.
        '408':
          description: The request timed out.
        '413':
          description: The request exceeds the maximum input size, meaning either the template or the model is too large.
        '422':
          description: The request exceeds the maximum output file size.
        '500':
          description: An internal server error occurred. Please contact support.
      tags:
        - Document Editing
  /analyze_build:
    post:
      summary: Analyze a build request
      description: |-
        Performs analysis of the Build API request without actually executing it.

        Use this endpoint to calculate how many credits a Build API request would consume. The request is free of charge.

        Note: Make sure to provide the correct `content_type` parameter for each of your file parts to get accurate results.
        Otherwise, the endpoint might not correctly identify conversion features such as Office or image conversion.
      operationId: analyze_build
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildInstructions'
      responses:
        '200':
          description: The analysis result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeBuildResponse'
        '400':
          description: The request is malformed. Some invalid data was supplied, or a precondition wasn't met.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedErrorResponse'
        '401':
          description: You are unauthorized. Sent when no API token is specified, or when the API token you specified isn't valid.
        '408':
          description: The request timed out.
        '500':
          description: An internal server error occurred. Please contact support.
      tags:
        - Document Editing
  /processor/convert_to_pdf:
    post:
      summary: Convert to PDF
      operationId: processor-convert-to-pdf
      description: |-
        Convert documents of any [supported format](#tag/File-Type-Support) to PDF.

        This endpoint is a simplified interface to the [Build API's](#tag/Document-Editing/operation/build-document)
        document conversion capabilities. Under the hood, it creates a Build API request with a single
        `FilePart`. For more advanced use cases, use the `/build` endpoint directly.
      requestBody:
        content:
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema:
              description: Raw DOCX document for direct upload
              format: binary
              type: string
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              description: Raw XLSX document for direct upload
              format: binary
              type: string
          image/jpeg:
            schema:
              description: Raw JPEG image for direct upload
              format: binary
              type: string
          image/png:
            schema:
              description: Raw PNG image for direct upload
              format: binary
              type: string
          application/json:
            schema:
              properties:
                url:
                  $ref: '#/components/schemas/url'
                password:
                  $ref: '#/components/schemas/password'
                layout:
                  $ref: '#/components/schemas/layout'
                pages:
                  $ref: '#/components/schemas/PageRange'
                content_type:
                  $ref: '#/components/schemas/content_type'
                markup_mode:
                  $ref: '#/components/schemas/markup_mode'
                email_language:
                  $ref: '#/components/schemas/email_language'
                email_timezone:
                  $ref: '#/components/schemas/email_timezone'
              required:
                - url
              type: object
            example:
              url: https://www.nutrient.io/api/assets/downloads/samples/docx/document.docx
          multipart/form-data:
            encoding:
              file:
                contentType: application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, image/*, text/html, message/rfc822, application/vnd.ms-outlook
              data:
                contentType: application/json
            schema:
              properties:
                file:
                  description: The document file to convert to PDF
                  format: binary
                  type: string
                  example: <Binary file data>
                data:
                  properties:
                    password:
                      $ref: '#/components/schemas/password'
                    layout:
                      $ref: '#/components/schemas/layout'
                    pages:
                      $ref: '#/components/schemas/PageRange'
                    content_type:
                      $ref: '#/components/schemas/content_type'
                    markup_mode:
                      $ref: '#/components/schemas/markup_mode'
                    email_language:
                      $ref: '#/components/schemas/email_language'
                    email_timezone:
                      $ref: '#/components/schemas/email_timezone'
                  type: object
                  example: {}
              required:
                - file
              type: object
      responses:
        '200':
          content:
            application/pdf:
              schema:
                description: The processed PDF file
                example: <PDF file>
                format: binary
                type: string
          description: The processed PDF document
          headers:
            x-pspdfkit-remaining-credits:
              $ref: '#/components/headers/x-pspdfkit-remaining-credits'
            x-pspdfkit-request-cost:
              $ref: '#/components/headers/x-pspdfkit-request-cost'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedErrorResponse'
          description: The request is malformed. Some invalid data was supplied, or a precondition wasn't met.
        '401':
          description: You are unauthorized. Sent when no API token is specified, or when the API token you specified isn't valid.
        '402':
          description: You have exceeded the total number of documents processed in your subscription.
        '408':
          description: The request timed out.
        '413':
          description: The request exceeds the maximum input size, meaning either a single part, or the sum of all parts, is large.
        '422':
          description: The request exceeds the maximum output file size.
        '500':
          description: An internal server error occurred. Please contact support.
      tags:
        - Document Editing
  /processor/generate_pdf:
    post:
      summary: Convert HTML to PDF
      operationId: processor-generate-pdf
      description: |-
        Generate PDF from HTML with assets (CSS, images, fonts, etc.).

        This endpoint is a simplified interface to the [Build API's](#tag/Document-Editing/operation/build-document)
        HTML conversion capabilities. Under the hood, it creates a Build API request with a `HTMLPart`.
        For more advanced use cases, use the `/build` endpoint directly.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                url:
                  $ref: '#/components/schemas/url'
                assets:
                  $ref: '#/components/schemas/assets'
                layout:
                  $ref: '#/components/schemas/PageLayout'
              required:
                - url
              type: object
            example:
              url: https://www.nutrient.io/api/assets/downloads/samples/html/index.html
          multipart/form-data:
            encoding:
              html:
                contentType: text/html
              data:
                contentType: application/json
            schema:
              properties:
                html:
                  description: The HTML file to convert to PDF
                  format: binary
