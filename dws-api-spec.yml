              example:
                - english
                - german
              items:
                $ref: '#/components/schemas/OcrLanguage'
        skipOcrForSearchableDocuments:
          type: boolean
          description: When true, OCR is skipped for pages that already contain text (born-digital pages).
          default: false
    RotateAction:
      type: object
      required:
        - type
        - rotateBy
      properties:
        type:
          type: string
          description: Rotate all pages by the angle specified.
          enum:
            - rotate
