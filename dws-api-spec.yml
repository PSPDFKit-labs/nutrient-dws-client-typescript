            - image
          properties:
            image:
              $ref: '#/components/schemas/FileHandle'
    WatermarkAction:
      oneOf:
        - $ref: '#/components/schemas/TextWatermarkAction'
        - $ref: '#/components/schemas/ImageWatermarkAction'
    PageIndex:
