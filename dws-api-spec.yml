        - type: object
          description: Dimension with explicit unit
          required:
            - value
            - unit
          properties:
            value:
              type: number
              description: Dimension value
              example: 100
            unit:
              type: string
              description: Dimension unit
              enum:
                - pt
                - '%'
    BaseWatermarkAction:
      type: object
      required:
        - type
        - width
        - height
      properties:
        type:
          type: string
          description: Watermark all pages with text watermark.
          enum:
            - watermark
        width:
          allOf:
            - type: object
              description: Width of the watermark in PDF points.
            - $ref: '#/components/schemas/WatermarkDimension'
        height:
          allOf:
            - type: object
              description: Height of the watermark in PDF points.
            - $ref: '#/components/schemas/WatermarkDimension'
        top:
          allOf:
            - type: object
              description: Offset of the watermark from the top edge of a page.
            - $ref: '#/components/schemas/WatermarkDimension'
        right:
          allOf:
            - type: object
              description: Offset of the watermark from the right edge of a page.
            - $ref: '#/components/schemas/WatermarkDimension'
        bottom:
          allOf:
            - type: object
              description: Offset of the watermark from the bottom edge of a page.
            - $ref: '#/components/schemas/WatermarkDimension'
        left:
          allOf:
            - type: object
              description: Offset of the watermark from the left edge of a page.
            - $ref: '#/components/schemas/WatermarkDimension'
        rotation:
          type: number
          description: Rotation of the watermark in counterclockwise degrees.
          default: 0
        opacity:
          type: number
          description: Watermark opacity. 0 is fully transparent, 1 is fully opaque.
          minimum: 0
          maximum: 1
    TextWatermarkAction:
      allOf:
        - $ref: '#/components/schemas/BaseWatermarkAction'
        - type: object
          title: Text
          required:
            - text
          properties:
            text:
              type: string
              description: Text used for watermarking
            fontFamily:
              type: string
              description: The font to render the text. Fonts are client specific, so you should only use fonts you know are present in the browser where they should be displayed. If a font isn't found, PSPDFKit will automatically fall back to a sans-serif font.
              example: Helvetica
            fontSize:
              description: Size of the text in points.
              type: integer
              example: 10
            fontColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
              description: A foreground color of the text.
              example: '#ffffff'
            fontStyle:
              type: array
              description: Text style. Can be only italic, only bold, italic and bold, or none of these.
              items:
                type: string
                enum:
                  - bold
                  - italic
    ImageWatermarkAction:
